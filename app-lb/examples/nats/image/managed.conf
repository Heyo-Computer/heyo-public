# Authentication is mandatory; NATS resolves this from start_command's env.
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
server_name: nats-managed
authorization { token: $NATS_TOKEN }
jetstream {
    store_dir: "/workspace"
    max_memory_store: 256MB
    max_file_store: 16GB
}
max_payload: 8MB
# start_command redirects startup errors to a rootfs file;
# NATS rotates its own log on the dedicated workspace.
log_file: "/workspace/nats.log"
log_size_limit: 16MB
logtime: true
