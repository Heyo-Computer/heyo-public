# Copied over /etc/resolv.conf by init.sh at boot. There is no DHCP on the tap
# network to learn a resolver from, and /etc/resolv.conf cannot be written at
# build time — Docker bind-mounts that path during a build, so what lands in the
# exported layer is unreliable.
#
# A plain NATS server resolves nothing. This matters when the config names a
# remote by hostname: a leafnode or gateway link, or an account resolver URL.
#
# Rewrite it with `DNS_SERVER=10.0.0.53 ./build-image.sh`.
nameserver 8.8.8.8
