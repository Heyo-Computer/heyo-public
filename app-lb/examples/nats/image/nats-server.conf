# NATS server configuration for the app-lb-managed microVM.
#
# Parsed at build time by the Dockerfile's `nats-server -c … -t`, so a typo here
# fails the image build rather than the boot.

# --- Listeners ------------------------------------------------------------
#
# 0.0.0.0, not 127.0.0.1, and that is the single most consequential line in this
# file. Every consumer of this server — app-lb's health check, queue-fn, heyo
# cloud — reaches it across the tap network at the VM's `guest_ip`. Bound to
# loopback the server would come up perfectly, answer nothing, and app-lb would
# kill and recreate the VM on `boot_timeout_secs` forever with the guest log
# showing a healthy start.
#
# The tap network is a host-local /30 per VM, so 0.0.0.0 here is reachable from
# the app-lb host and not from anywhere else. See the README on authentication
# before that stops being true.
listen: 0.0.0.0:4222

# The HTTP monitoring endpoint: /healthz, /varz, /jsz, /connz, /subsz, /routez.
# This is the port app-lb proxies and health-checks, because it is the only part
# of NATS that speaks HTTP — see the README on why the client port cannot go
# through the proxy.
http: 0.0.0.0:8222

server_name: nats-heyo

# --- JetStream ------------------------------------------------------------
#
# store_dir is on the data disk (/dev/vdb, mounted by init.sh at /workspace) and
# this is not a preference. mvm-ctrl recopies the rootfs from the base image on
# every cold boot, so a store under /var/lib or /data would be discarded each
# time the VM was recreated — and it would do so silently, because JetStream
# recreates an empty store without complaint. What that costs is concrete: every
# message queue-fn has published and not yet acked, and every cloud sandbox
# create still waiting for a worker.
#
# init.sh refuses to start the server if this path is not on a mount, so a
# regression here is a VM that fails its health check rather than one that
# quietly loses the queue.
jetstream {
    # `/workspace`, not `/workspace/jetstream`: nats-server appends `jetstream`
    # to store_dir itself, so naming the subdirectory here produces
    # `/workspace/jetstream/jetstream`. The store lands at /workspace/jetstream
    # either way — this spelling is just the one whose config and on-disk layout
    # agree, which matters when someone is reading the two side by side at 3am.
    store_dir: "/workspace"

    # Ceilings, not reservations. Left generous relative to a `medium` size
    # class and a 20 GiB data disk; JetStream refuses new messages rather than
    # filling the disk out from under the store, which is the failure mode you
    # want (publishers get an error) over the one you don't (an ENOSPC in the
    # middle of a write).
    max_memory_store: 256MB
    max_file_store: 16GB
}

# --- Limits ---------------------------------------------------------------

# The default is 64MB. queue-fn caps its own payloads at 4KB and cloud's
# envelopes are small, so a lower ceiling costs nothing and bounds what a
# misconfigured publisher can push through a VM with limited memory.
max_payload: 8MB

# --- Logging --------------------------------------------------------------
#
# To a file, never to stdout. init.sh starts the server in the background and
# the VM's stdout *is* the serial console, which carries heyvm's command
# protocol — stray lines on it corrupt the exec channel that `serverctl exec`
# and `serverctl shell` depend on. The log is on the data disk so it survives
# the cold boot that discards the rootfs, which is the boot you most want to
# read the log from.
log_file: "/workspace/log/nats-server.log"
logtime: true

# Rotation, because nothing else on this VM will do it and a log that fills the
# data disk takes JetStream down with it.
log_size_limit: 64MB

# --- Authentication -------------------------------------------------------
#
# Deliberately absent by default: the tap network is a host-local /30 and app-lb
# is required to run beside a *local* daemon, so an unauthenticated listener
# here is reachable from the same trust boundary as a 127.0.0.1 bind.
#
# That reasoning stops holding the moment anything routes to the guest network
# from off-host. To add credentials without rebuilding the image, drop a fragment
# on the data disk and reboot the VM — init.sh includes it when it exists:
#
#     serverctl exec nats -- sh -c 'mkdir -p /workspace/nats && cat > /workspace/nats/auth.conf <<EOF
#     authorization { token: "s3cret" }
#     EOF'
#     serverctl restart nats
#
# Then point the clients at it: QFN_NATS_TOKEN for queue-fn, and the userinfo in
# cloud's CLOUD_NATS_URL. It lives on the data disk rather than in the image so
# a credential is never baked into a rootfs that gets copied around.
