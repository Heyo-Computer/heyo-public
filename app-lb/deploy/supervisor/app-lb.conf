# supervisord program definition for app-lb.
#
# Install into your supervisord include dir (typically
# /etc/supervisor/conf.d/app-lb.conf), then `supervisorctl reread && update`.
# See deploy/supervisor/README.md for the one-time host setup.
#
# app-lb is configured entirely by APP_LB_* environment variables (no CLI args)
# and runs in the foreground, so supervisord manages the process directly.

[program:app-lb]
command=/usr/local/bin/app-lb
directory=/var/lib/app-lb
user=app-lb

# app-lb reads configuration only from the environment. STATE_PATH is pinned to
# an absolute path so persisted deployments are found regardless of CWD. Defaults
# mirror the built-in ones; uncomment and edit the rest as needed. Note: setting
# only one of TLS_CERT/TLS_KEY, or ADMIN_AUTH without a password, makes app-lb
# panic at startup (which is why startretries below is bounded).
environment=
    RUST_LOG="info,app_lb=debug",
    APP_LB_STATE_PATH="/var/lib/app-lb/app-lb-state.json",
    APP_LB_DAEMON_URL="http://127.0.0.1:34099",
    ; Change to "0.0.0.0:80" if you enable ACME below — http-01 validation is
    ; fetched on port 80 and nowhere else. Needs setcap; see the README.
    APP_LB_PROXY_ADDR="0.0.0.0:6188",
    APP_LB_ADMIN_ADDR="127.0.0.1:9090"
    ; Build hosts only. `heyvm mvm build` shells out to docker, which needs a
    ; writable $HOME, and then writes the image to $HOME/.heyo/images/firecracker
    ; where heyvmd must be able to find it. See the README's HOME note: this must
    ; be a directory app-lb can write AND the home heyvmd resolves images under.
    ; ,APP_LB_HEYVM_HOME="/home/heyo"
    ; ,APP_LB_NAME="app-lb"
    ; ,APP_LB_DASHBOARD_USER="admin"
    ; ,APP_LB_DASHBOARD_PASSWORD="change-me"       ; enables dashboard Basic Auth
    ; ,APP_LB_ADMIN_AUTH="1"                        ; gates CRUD too; needs a password
    ; ,APP_LB_TLS_CERT="/etc/app-lb/tls/cert.pem"   ; set BOTH cert+key, or NEITHER
    ; ,APP_LB_TLS_KEY="/etc/app-lb/tls/key.pem"     ; the FALLBACK cert when ACME is on
    ; ,APP_LB_PROXY_TLS_ADDR="0.0.0.0:6189"
    ; Automatic Let's Encrypt certificates per deployment hostname. Enabling this
    ; REQUIRES setting APP_LB_PROXY_ADDR to "0.0.0.0:80" above, plus
    ; `setcap cap_net_bind_service=+ep` on the binary. Point ACME_DIRECTORY at LE
    ; staging while testing: production limits are weekly and account-wide.
    ; ,APP_LB_ACME_EMAIL="ops@example.com"
    ; ,APP_LB_ACME_DIR="/var/lib/app-lb/acme"       ; 0700; holds private keys
    ; ,APP_LB_ACME_DIRECTORY="https://acme-staging-v02.api.letsencrypt.org/directory"
    ; Push the access log, app-lb's own events and deploy-job output to app-obs.
    ; Setting the URL is what enables it; the token must match app-obs's
    ; APP_OBS_INGEST_TOKEN. Both the queue and a failed POST drop rather than
    ; block, so a collector that is down or behind costs telemetry and never
    ; traffic.
    ; ,APP_LB_OBS_URL="127.0.0.1:9500"          ; bare host:port is fine; http is assumed
    ; ,APP_LB_OBS_TOKEN="change-me"
    ; app-lb's own records need a deployment id in app-obs; it defaults to the
    ; reserved "_lb". Name it per host when several LBs share one collector, or
    ; both hosts' events interleave under the same name.
    ; ,APP_LB_OBS_DEPLOYMENT="lb-us2"
    ; ,APP_LB_OBS_ACCESS_LOG="0"                    ; keep only app-lb's own events

# Restart policy. `unexpected` restarts on a non-zero/panic exit but not a clean
# stop. startsecs marks a fast exit (e.g. a startup panic on misconfig) as a
# failed start, and startretries bounds the crash-loop before FATAL.
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
exitcodes=0

# SIGTERM triggers Pingora's graceful shutdown; give in-flight requests time to
# drain (the default VM drain window is 30s) before supervisord SIGKILLs.
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true

# app-lb logs to stdout/stderr via tracing.
stdout_logfile=/var/log/app-lb/app-lb.log
stderr_logfile=/var/log/app-lb/app-lb.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
