[package]
name = "app-lb"
version = "0.1.0"
edition = "2024"

[dependencies]
# Proxy data plane. The `rustls` feature enables the optional client-facing
# HTTPS listener (see `APP_LB_TLS_*`); upstreams stay plaintext guest_ip on the
# tap network regardless. rustls — not openssl/boringssl — is deliberate: it is
# the same TLS stack heyo-sdk already pulls in through reqwest, so enabling it
# adds no second TLS library to the link.
pingora-core = { version = "0.8.1", features = ["rustls"] }
pingora-proxy = "0.8.1"
pingora-http = "0.8.1"
# Shared with pingora's own public API (RequestHeader/ResponseHeader are built
# on `http`, and response bodies are `bytes::Bytes`), so these must stay on the
# same major versions pingora resolves.
http = "1"
bytes = "1"

heyo-sdk = "0.1.6"

async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
arc-swap = "1"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encoding the configured dashboard credentials into the expected Basic-auth
# header once at startup. Already in the tree transitively (reqwest/pingora).
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
