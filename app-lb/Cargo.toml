[package]
name = "app-lb"
version = "0.1.0"
edition = "2024"

# `serverctl` — the CLI for the admin API — is a separate crate rather than a
# second binary here, so installing it doesn't drag in pingora, openssl and the
# ACME stack. It shares nothing with the LB but the wire format.
[workspace]
members = ["serverctl"]

[dependencies]
# Proxy data plane. The `openssl` feature enables the client-facing HTTPS
# listener (see `APP_LB_TLS_*` / `APP_LB_ACME_*`); upstreams stay plaintext
# guest_ip on the tap network regardless.
#
# openssl — not rustls — because per-deployment ACME certificates need a cert
# chosen per handshake from the SNI. That is `TlsSettings::with_callbacks`, and
# pingora supports it only under openssl/boringssl: the rustls build returns a
# hard "Certificate callbacks are not supported" error and exposes no
# `ResolvesServerCert` hook. The cost is a second TLS stack in the link, since
# heyo-sdk still pulls rustls through reqwest, plus a libssl-dev build
# dependency. See `src/tls.rs`.
pingora-core = { version = "0.8.1", features = ["openssl"] }
pingora-proxy = "0.8.1"
pingora-http = "0.8.1"
# Shared with pingora's own public API (RequestHeader/ResponseHeader are built
# on `http`, and response bodies are `bytes::Bytes`), so these must stay on the
# same major versions pingora resolves.
http = "1"
bytes = "1"

heyo-sdk = "0.1.6"

# ACME (Let's Encrypt) client for per-deployment certificates. In-process rather
# than shelling out to certbot: no external binary, and no root — the account key
# and issued certs live under `APP_LB_ACME_DIR`, owned by the non-root `app-lb`
# user. The `rcgen` feature is what makes `Order::finalize()` available, which
# generates each certificate's keypair and CSR for us, so rcgen needs no direct
# dependency here.
instant-acme = { version = "0.8", features = ["rcgen"] }
# Certificate parsing and expiry arithmetic. pingora-openssl re-exports `x509`
# and `pkey` but not `asn1`, and comparing a cert's notAfter against a renewal
# threshold needs `Asn1Time`. Must resolve to the same 0.10.x that
# pingora-openssl picks, or the `X509`/`PKey` types won't unify across crates.
openssl = "0.10"
# Not used directly for anything but installing the process-level
# `CryptoProvider`. rustls is still in the tree under instant-acme's HTTP client
# (and reqwest), and 0.23 refuses to pick a provider automatically when both
# `ring` and `aws-lc-rs` are present — which they are, via iroh/hickory and
# instant-acme respectively. pingora's *rustls* build used to install one for us
# inside `TlsSettings::build()`; the openssl build never calls that, so app-lb
# has to do it. Must match the version the rest of the graph resolves to, or the
# provider gets installed into a different crate's static and the panic remains.
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# The OAuth token exchange for the Google sign-in gate (`src/auth.rs`) — one
# HTTPS POST per login. Already compiled in the graph via heyo-sdk, so this is a
# dependency line rather than a new build; the features match heyo-sdk's so the
# two resolve to one copy.
#
# `stream` is for the artifact puller (`src/artifact.rs`), which reads a rootfs
# blob off the wire chunk by chunk. A rootfs is gigabytes; `bytes()` would hold
# the whole thing in memory before the first byte reached disk.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Query-string building (the authorize URL) and parsing (the callback). Small,
# already present under reqwest/url, and hand-rolling percent-encoding is a
# classic source of bugs.
form_urlencoded = "1"

async-trait = "0.1"
futures = "0.3"
# `process` is for the image builder (`src/build.rs`), which shells out to `git`
# and `heyvm mvm build`: heyvm exposes no build API, so this is the only way to
# turn a Dockerfile into a guest rootfs. It buys `kill_on_drop`, which is what
# lets a timed-out `docker build` actually die instead of outliving its future.
#
# `fs` and `io-util` are the artifact puller's write side: a streamed blob lands
# in a file, and the copy must not block the runtime for the minutes a
# multi-gigabyte rootfs takes.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "process", "fs", "io-util"] }
arc-swap = "1"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encoding the configured dashboard credentials into the expected Basic-auth
# header once at startup. Already in the tree transitively (reqwest/pingora).
base64 = "0.22"
# Verifying a rootfs pulled over the wire against the digest that named it
# (`src/artifact.rs`). sha256 and not something faster because the digest has to
# be the one the artifact store computed, which is the one `sha256sum` reports.
# Already in the tree via pingora and heyo-sdk.
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
