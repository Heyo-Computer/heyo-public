; supervisord program definition for the CI orchestrator.
;
; Install into your supervisord include dir (typically
; /etc/supervisor/conf.d/ci.conf), then `supervisorctl reread && supervisorctl update`.
;
; `ci` is configured entirely by CI_* environment variables — there are no CLI
; arguments — and runs in the foreground, so supervisord manages it directly.
; Every misconfiguration is a startup exit with a message naming the variable,
; which is why `startretries` below is bounded: retrying a bad config forever
; just fills the log.

[program:ci]
command=/usr/local/bin/ci
directory=/var/lib/ci
user=ci

environment=
    RUST_LOG="info,ci=debug",

    ; --- required -------------------------------------------------------
    ; The bearer for the heyvm cloud and for every runner daemon.
    CI_HEYO_API_KEY="REPLACE-ME",
    ; The heyvm network(s) whose `host` members are the runner pool, and which
    ; this instance takes work for. One name or id, several separated by
    ; commas, or `*` for every network on the account. The first entry is the
    ; default for a repository that names none on /repos.
    ;
    ; Not a discovery: jobs are sharded onto one durable consumer per runner
    ; and per network so several orchestrators can run at once, which only
    ; holds while they own disjoint sets. `*` is right for a single instance.
    CI_NETWORK="prod-runners",
    ; Postgres. :6432 is the pgbouncer convention — but check what is actually
    ; listening before assuming it is a pooler. A per-database VM pool answers
    ; on the same port on some fleets, and it suspends idle instances: the first
    ; query after a suspend waits on a wake that can take minutes, on a socket
    ; that stays established the whole time.
    CI_DATABASE_URL="postgres://ci:REPLACE-ME@us2.heyo.work:6432/ci",
    ; Bound on every statement, because the pool's `acquire_timeout` is not one.
    ; It bounds checking a connection *out* of the pool; a statement on a
    ; connection already held waits for ever if the server never answers. That
    ; is the failure above, and it is invisible: a consumer reads a job row
    ; before it logs anything, so a wedge there is a dispatcher that stops
    ; working without saying so, and the job is failed much later for the wrong
    ; reason. 30s is far past any query this makes. Migrations are exempt.
    ; `0` disables the bound.
    ; ,CI_DB_STATEMENT_TIMEOUT_SECS="30"

    ; The shared HMAC secret `git submit` signs with when it has no
    ; per-repository token. It is one of two things between the public submit
    ; endpoint and arbitrary code execution on a runner, so it must be at least
    ; 16 bytes and should be generated, not chosen.
    ;
    ; The other, and the better one, is a repository token minted on /repos: it
    ; is revocable for one repository and it says which repository is
    ; submitting, which this cannot. Register every repository, then set
    ; CI_REQUIRE_REPO_TOKEN below and this becomes unusable.
    CI_WEBHOOK_SECRET="REPLACE-ME",

    ; --- where it listens ------------------------------------------------
    CI_LISTEN_ADDR="127.0.0.1:9500",
    ; Used for the run URLs `git submit` prints back and for the /repos link in
    ; a rejected submit's error, so it has to be what a browser would use, not
    ; the loopback address above.
    CI_PUBLIC_URL="https://ci.us2.heyo.work",

    ; --- queue -----------------------------------------------------------
    ; Comma-separated for a cluster. Loopback, not nats.internal: the server listens on 127.0.0.1:4222 only
    ; (queue-fn's deploy/nats-server.conf), and it is co-located with this
    ; process. A hostname here only works if it resolves to loopback on this
    ; box, and it gives up the property that makes the loopback bind safe.
    CI_NATS_URL="nats://127.0.0.1:4222",
    ; --- the NATS credential ---------------------------------------------
    ; Four ways to authenticate, and **exactly one may be set**. They are not
    ; a precedence order: naming two is a startup error rather than a silent
    ; choice, because guessing which an operator meant is how a process ends
    ; up authenticating as the wrong principal.
    ;
    ;   CI_NATS_USER + CI_NATS_PASSWORD   user/password. Both or neither —
    ;                                     a user alone is not a token, and
    ;                                     either half alone is refused.
    ;   CI_NATS_TOKEN                     a bare token.
    ;   CI_NATS_CREDS                     path to a .creds file (NATS JWT).
    ;                                     Read at startup; an unreadable path
    ;                                     is a startup error.
    ;   CI_NATS_NKEY                      an nkey seed.
    ;
    ; Userinfo in CI_NATS_URL (`nats://user:pass@host`) still works and is the
    ; last resort: any of the above overrides it, and `ci` warns at startup
    ; when a credential arrives that way, because a URL is visible in shell
    ; history, process listings and container specs. Only the sanitized
    ; servers are ever logged.
    ;
    ; The server (queue-fn's deploy/nats-server.conf) authenticates with
    ; user/password and puts `ci` in its own CI account. The system credential
    ; is not a substitute: JetStream cannot be enabled on the system account,
    ; so a `sys` login gets as far as connecting and then fails on CI_JOBS.
    CI_NATS_USER="ci",
    CI_NATS_PASSWORD="REPLACE-ME",
    ; ,CI_NATS_TOKEN="REPLACE-ME"
    ; ,CI_NATS_CREDS="/etc/ci/nats.creds"
    ; ,CI_NATS_NKEY="REPLACE-ME"

    ; Namespace for both streams and every subject and durable consumer name.
    ; Interpolated verbatim, so it is charset-checked at startup: one or more
    ; of [A-Za-z0-9_-]. Two installations sharing a NATS server need different
    ; prefixes or they share a work queue.
    CI_NATS_SUBJECT_PREFIX="ci",

    ; --- state on disk ---------------------------------------------------
    ; Step logs and submitted trees. Both grow; put them somewhere with room.
    CI_LOG_DIR="/var/lib/ci/logs",
    CI_WORKSPACE_DIR="/var/lib/ci/workspaces",
    ; Migrations are compiled into the binary and re-executed in filename
    ; order on every startup. Leave CI_MIGRATIONS_DIR unset: it used to be the
    ; only source, which is how a binary and its schema came apart once
    ; (2026-08-25, `column p.size_class does not exist` from a build installed
    ; without its newest file). Set, it runs *additional* SQL from that
    ; directory after the embedded set — never instead of it — for an operator
    ; who needs SQL this build does not carry.
    ; ,CI_MIGRATIONS_DIR="/var/lib/ci/migrations"

    ; --- artifacts -------------------------------------------------------
    ; disk | artifacts. `s3` is declared but not implemented and fails loudly.
    CI_ARTIFACT_SINK="disk",
    CI_ARTIFACT_DIR="/var/lib/ci/artifacts"
    ; For the content-addressed store, point every instance at ONE central
    ; `art serve` — the store is per-host and single-replica, so N runners
    ; pushing to N stores produces N stores that disagree.
    ; ,CI_ARTIFACT_SINK="artifacts"
    ; ,CI_ARTIFACT_URL="https://artifacts.us2.heyo.work"
    ; ,CI_ARTIFACT_TOKEN="REPLACE-ME"

    ; --- the shared UI ---------------------------------------------------
    ; Where the theme cookie is written. Set it to the same realm as the
    ; deployment spec's `auth.cookie_domain` and one choice of light or dark
    ; covers every Heyo app on that domain, exactly as one sign-in does. Unset
    ; means a host-only cookie, which is right for a single instance.
    ;
    ; `HEYO_UI_COOKIE_DOMAIN` sets it for every app on this host; the `CI_`
    ; spelling overrides it for this one. See ui/README.md.
    ; ,CI_UI_COOKIE_DOMAIN="us2.heyo.work"

    ; --- secrets ---------------------------------------------------------
    ; This process is the policy layer: heyosecret's token can read every
    ; secret at every path, so it lives here and never reaches a build.
    ; ,CI_HEYOSECRET_URL="https://heyosecret.us2.heyo.work"
    ; ,CI_HEYOSECRET_TOKEN="REPLACE-ME"

    ; --- workflow objects ------------------------------------------------
    ; Where `serverctl create workflow` stores them. Without this, submits fall
    ; back to CI_WORKFLOW_PATH.
    ; ,CI_APP_LB_URL="http://127.0.0.1:9090"
    ; ,CI_APP_LB_TOKEN="REPLACE-ME"
    ; ,CI_WORKFLOW_PATH=".ci/workflows/*.yml"

    ; --- people ----------------------------------------------------------
    ; app-lb has no roles, so `ci` keeps its own, seeded from this list.
    ;
    ; Set this on any real deployment. Registering a repository mints a token
    ; that can run code on a runner, and /repos is admin-only — but with this
    ; empty it also accepts a request that carries no app-lb identity at all,
    ; which is the local loop. Startup warns when it is unset.
    ; ,CI_ADMIN_EMAILS="sam@sarocu.com"

    ; --- repository tokens -----------------------------------------------
    ; Refuse the shared CI_WEBHOOK_SECRET, leaving only the per-repository
    ; tokens minted on /repos. Turn this on once every repository that submits
    ; has one; until then it locks out every existing client.
    ; ,CI_REQUIRE_REPO_TOKEN="false"

    ; --- logs ------------------------------------------------------------
    ; How long step and VM logs are kept on disk. Logs are the bulk of what
    ; this process writes and nothing else prunes them, so this defaults to 2
    ; days rather than to forever. `0` keeps everything — a decision about
    ; disk, not a default. Step rows and their exit codes are always kept;
    ; only the bytes age out.
    ; ,CI_LOG_RETENTION_DAYS="2"
    ; Lines of a VM's own console attached to each job.
    ; ,CI_VM_LOG_LINES="500"

    ; Where heyvmd keeps daemon.json — the id `uses: default` resolves to.
    ; Resolved as mvm-ctrl does: MVM_DATA_DIR if set, else ~/.heyo. Set this
    ; only if heyvmd runs with a data dir this process cannot infer.
    ; ,CI_DAEMON_STATE_PATH="/var/lib/heyvm/daemon.json"

    ; --- the VM lease ----------------------------------------------------
    ; How long a claimed VM stays held without a renewal — the window between
    ; an instance dying and its VMs being reclaimed by another. Renewal runs at
    ; a third of this. Raise it if the database is slow enough that renewals
    ; are missed; losing a lease that is still in use puts two dispatchers on
    ; one sandbox, which is much worse than reclaiming late.
    ; ,CI_VM_LEASE_SECS="180"

    ; --- tuning ----------------------------------------------------------
    ; ,CI_RUNNER_REFRESH_SECS="30"
    ; Wall clock a single job is cut off at. Enforced by the executor; the
    ; queue's redelivery window is independent of it (a running job extends
    ; that itself), so raising this no longer delays recovery after a crash.
    ; ,CI_MAX_JOB_SECONDS="14400"
    ; Both of the above are measured from the moment a consumer picks the job
    ; up, never from when it was queued: jobs lined up behind a busy runner
    ; wait with their budgets untouched. CI_RUNNER_WAIT_SECS (default 1800)
    ; fails only a job nothing will ever take — an offline pinned host, a
    ; queue with no consumer. To cap time spent waiting on a *busy* runner,
    ; set CI_QUEUE_WAIT_SECS; unset (the default) means no cap.
    ; ,CI_QUEUE_WAIT_SECS="7200"
    ; Backstop TTL on every VM this app creates. A VM running a job has its
    ; TTL renewed on the lease loop, so this no longer has to exceed
    ; CI_MAX_JOB_SECONDS. It bounds a *running* VM only: a released VM is
    ; stopped, which the daemon's reaper ignores.
    ; ,CI_VM_TTL_SECONDS="3600"
    ; How long a parked (stopped, idle) pooled VM is kept, measured from its
    ; last use. This is the pool's clock, not the daemon's: a stopped VM costs
    ; disk — its rootfs clone and its cache disk — and nothing else, and this
    ; is what reclaims that disk. Idle VMs past this, and idle VMs whose
    ; fingerprint no job has used within it, are destroyed by the lease loop.
    ; A week by default so a build cache survives a weekend.
    ; ,CI_VM_IDLE_SECS="604800"
    ; ,CI_MAX_SOURCE_BYTES="67108864"
    ;
    ; Local development only: drives one local heyvmd and skips the cloud
    ; entirely. Never set this on a real deployment — it makes the whole
    ; runner pool a single machine.
    ; ,CI_LOCAL_RUNNER="1"
    ;
    ; An iroh ticket is bearer-equivalent, so a daemon with no JWT_SECRET
    ; hands a host shell to anyone who has seen its ticket. Only set this
    ; where the tunnel never leaves localhost.
    ; ,CI_ALLOW_UNAUTHENTICATED_RUNNERS="false"

autostart=true
; `unexpected` and not `true`: a config error exits non-zero and should stay
; down with the message visible, rather than looping.
autorestart=unexpected
startsecs=5
startretries=3

; TERM, and enough time to finish the in-flight HTTP requests. A running build
; is not lost by a restart — its job is still on the queue and JetStream
; redelivers it, which is the whole reason the executor is idempotent.
stopsignal=TERM
stopwaitsecs=30

; `ci` logs to stdout/stderr via tracing; let supervisord own the files.
redirect_stderr=true
stdout_logfile=/var/log/ci.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
