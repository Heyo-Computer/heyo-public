# Operator configuration example, NOT a submit workflow. Review and provision
# through HeyoSecret only after both CI apps support CI_RELEASE_POLICIES.
# Existing host-maintenance and host-heyvm-bootstrap mappings remain authoritative.
# This is the normal maintenance path; it does not enable legacy bootstrap.
https://github.com/Heyo-Computer/heyo.git:
  workflow_path: .ci/workflows/regional-release.yml
  placements:
    heyvmd-us3: eu1
    heyvmd-eu1: us3
  service_targets:
    cloud-us3:
      url: https://admin.us3.heyo.work
      deployment: cloud-us3
      namespace: default
      mount_path: /opt/cloud-release
      revision_env: HEYO_CLOUD_DEPLOYMENT_GIT_SHA
      start_command: /opt/cloud-release/start.sh
      working_directory: /opt/cloud-release
    cloud-eu1:
      url: https://admin.eu1.heyo.work
      deployment: cloud-eu1
      namespace: default
      mount_path: /opt/cloud-release
      revision_env: HEYO_CLOUD_DEPLOYMENT_GIT_SHA
      start_command: /opt/cloud-release/start.sh
      working_directory: /opt/cloud-release
  workflow: |
    name: regional-release
    on: release
    env:
      US_CLOUD_HEALTH: https://cloud.us3.heyo.work/health
      EU_CLOUD_HEALTH: https://cloud.eu1.heyo.work/health
      US_CI_HEALTH: https://ci.us3.heyo.work/health
      EU_CI_HEALTH: https://ci.eu1.heyo.work/health
    jobs:
      merge:
        vm: &release_vm
          driver: firecracker
          build:
            dockerfile: .ci/image/bun/Dockerfile
            context: .ci/image/bun
            size_mb: 4096
          size_class: small
          disk_size_gb: 10
          ttl_seconds: 3600
        steps:
          - uses: ci/merge-release
            with:
              manifests: '[]'
              token: ${{ secrets.CI_GIT_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      cloud-us3:
        needs: [merge]
        vm: *release_vm
        timeout-minutes: 40
        steps:
          - uses: ci/rollout-service
            if: &cloud_changed ${{ changed('cloud/**', 'storage/**', 'local-proxy/**', 'rust-toolchain.toml', '.ci/cargo-lock-sync.sh', '.ci/package-service-archive.sh', '.ci/workflows/cloud.yml', '.ci/image/rust/**', '.ci/workflows/regional-release.yml') }}
            timeout-minutes: 30
            with:
              target: cloud-us3
              token: ${{ secrets.APP_LB_US3_TOKEN }}
              workflow: .ci/workflows/cloud.yml
              artifact: cloud
      heyvm-us3:
        needs: [cloud-us3]
        vm: *release_vm
        timeout-minutes: 60
        steps:
          - id: archive
            if: &heyvm_changed ${{ changed('mvm-ctrl/**', 'local-proxy/**', 'kvmbind/**', 'avfbind/**', 'rust-toolchain.toml', '.ci/cargo-lock-sync.sh', '.ci/workflows/mvm-ctrl.yml', '.ci/image/rust/**', '.ci/workflows/regional-release.yml') }}
            run: |
              set -eu
              version="$(awk -F'"' '/^version = /{print $2; exit}' mvm-ctrl/Cargo.toml)"
              test -n "$version"
              printf 'path=dist/heyvm-%s-unknown-linux-gnu-x86_64.tar.gz\n' "$version" >> "$CI_OUTPUT"
          - uses: ci/promote-service-archive
            id: publish
            if: *heyvm_changed
            with:
              target: us3
              workflow: .ci/workflows/mvm-ctrl.yml
              artifact: heyvm
              path: ${{ steps.archive.outputs.path }}
              token: ${{ secrets.ORCHESTRATOR_TOKEN }}
              name: host-heyvm-us3
          - uses: ci/host-heyvm-maintenance
            if: *heyvm_changed
            timeout-minutes: 50
            with:
              target: us3
              token: ${{ secrets.CLOUD_TOKEN }}
              archive-id: ${{ steps.publish.outputs.archive-id }}
      heyvmd-us3:
        needs: [heyvm-us3]
        vm: *release_vm
        timeout-minutes: 60
        steps:
          - uses: ci/rollout-host-heyvmd
            if: *heyvm_changed
            timeout-minutes: 50
            with:
              target: heyvmd-us3
              token: ${{ secrets.APP_LB_US3_TOKEN }}
              workflow: .ci/workflows/mvm-ctrl.yml
              artifact: heyvm
      verify-us3:
        needs: [heyvmd-us3]
        vm: *release_vm
        steps:
          - name: Check US public health after host updates
            run: |
              set -eu
              for sample in $(seq 1 12); do
                test "$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$US_CLOUD_HEALTH")" = 200
                test "$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$US_CI_HEALTH")" = 200
                sleep 5
              done
      cloud-eu1:
        needs: [verify-us3]
        vm: *release_vm
        timeout-minutes: 40
        steps:
          - uses: ci/rollout-service
            if: *cloud_changed
            timeout-minutes: 30
            with:
              target: cloud-eu1
              token: ${{ secrets.APP_LB_EU1_TOKEN }}
              workflow: .ci/workflows/cloud.yml
              artifact: cloud
      heyvm-eu1:
        needs: [cloud-eu1]
        vm: *release_vm
        timeout-minutes: 60
        steps:
          - id: archive
            if: *heyvm_changed
            run: |
              set -eu
              version="$(awk -F'"' '/^version = /{print $2; exit}' mvm-ctrl/Cargo.toml)"
              test -n "$version"
              printf 'path=dist/heyvm-%s-unknown-linux-gnu-x86_64.tar.gz\n' "$version" >> "$CI_OUTPUT"
          - uses: ci/promote-service-archive
            id: publish
            if: *heyvm_changed
            with:
              target: eu1
              workflow: .ci/workflows/mvm-ctrl.yml
              artifact: heyvm
              path: ${{ steps.archive.outputs.path }}
              token: ${{ secrets.ORCHESTRATOR_TOKEN }}
              name: host-heyvm-eu1
          - uses: ci/host-heyvm-maintenance
            if: *heyvm_changed
            timeout-minutes: 50
            with:
              target: eu1
              token: ${{ secrets.CLOUD_TOKEN }}
              archive-id: ${{ steps.publish.outputs.archive-id }}
      heyvmd-eu1:
        needs: [heyvm-eu1]
        vm: *release_vm
        timeout-minutes: 60
        steps:
          - uses: ci/rollout-host-heyvmd
            if: *heyvm_changed
            timeout-minutes: 50
            with:
              target: heyvmd-eu1
              token: ${{ secrets.APP_LB_EU1_TOKEN }}
              workflow: .ci/workflows/mvm-ctrl.yml
              artifact: heyvm
      verify-eu1:
        needs: [heyvmd-eu1]
        vm: *release_vm
        steps:
          - name: Check EU public health after host updates
            run: |
              set -eu
              for sample in $(seq 1 12); do
                test "$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$EU_CLOUD_HEALTH")" = 200
                test "$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$EU_CI_HEALTH")" = 200
                sleep 5
              done
