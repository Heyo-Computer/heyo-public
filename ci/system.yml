# Registered platform pipeline: CI, control-plane services, and native runners.
# Register this path on the target CI installation; no us2 host pin is inherited.
name: CI system
on: [submit]
jobs:
  linux:
    vm: &linux
      driver: firecracker
      build:
        dockerfile: .ci/image/ci/Dockerfile
        context: .ci/image/ci
        size_mb: 10240
      size_class: large
      disk_size_gb: 40
      ttl_seconds: 14400
      cache_key_files: [rust-toolchain.toml, ci/rust-toolchain.toml]
    timeout-minutes: 120
    steps:
      - name: Require attached build disk
        run: test "$(stat -c %d /var/cache/ci)" != "$(stat -c %d /)"
      - name: Test CI
        working-directory: /workspace/ci
        timeout-minutes: 60
        run: cargo test --locked -- --test-threads=1
      - name: Build CI service
        working-directory: /workspace/ci
        timeout-minutes: 60
        run: cargo build --locked --release --bins
      - name: Test submission client
        run: python3 ci/test-git-submit.py
      - name: Test artifact boot guards
        run: python3 ci/deploy/test_start_artifact.py
      - name: Package validated binaries
        run: |
          set -eu
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/release/ci" dist/ci
          cp "$CARGO_TARGET_DIR/release/native-runner-agent" dist/native-runner-agent
          cp ci/deploy/start-artifact.sh dist/start-artifact.sh
          printf '%s\n' '${{ ci.sha }}' > dist/REVISION
          (cd dist && sha256sum ci native-runner-agent start-artifact.sh > SHA256SUMS)
      - uses: ci/upload-artifact
        with: { name: ci-linux, path: dist }

  platform:
    vm: *linux
    strategy:
      matrix:
        component: [app-lb, artifacts, heyosecret, orchestrator]
      max-parallel: 2
      fail-fast: false
    timeout-minutes: 180
    steps:
      - name: Require attached build disk
        run: test "$(stat -c %d /var/cache/ci)" != "$(stat -c %d /)"
      - name: Test component and workspace members
        timeout-minutes: 90
        run: cd '/workspace/${{ matrix.component }}' && cargo test --locked --workspace
      - name: Build component binaries
        timeout-minutes: 90
        run: cd '/workspace/${{ matrix.component }}' && cargo build --locked --release --workspace --bins
      - name: Package validated component
        run: |
          set -eu
          component='${{ matrix.component }}'
          case "$component" in
            app-lb) binaries='app-lb heyctl' ;;
            artifacts) binaries=art ;;
            heyosecret|orchestrator) binaries="$component" ;;
            *) exit 1 ;;
          esac
          mkdir -p dist
          for binary in $binaries; do
            cp "$CARGO_TARGET_DIR/release/$binary" "dist/$binary"
          done
          printf '%s\n' '${{ ci.sha }}' > dist/REVISION
          (cd dist && sha256sum $binaries > SHA256SUMS)
      - uses: ci/upload-artifact
        with: { name: '${{ matrix.component }}-linux', path: dist }

  mac-intel:
    runs-on: [namespace-profile-mac-build, macos, macos-intel, x86_64-apple-darwin]
    timeout-minutes: 120
    steps:
      - name: Test native agent
        working-directory: ci
        run: cargo test --locked --bin native-runner-agent
      - name: Build native agent
        working-directory: ci
        run: cargo build --locked --release --bin native-runner-agent
      - uses: ci/upload-artifact
        with: { name: native-agent-mac-intel, path: ci/target/release/native-runner-agent }

  windows:
    runs-on: [blacksmith-2vcpu-windows-2025, windows, windows-x64, x86_64-pc-windows-msvc]
    timeout-minutes: 120
    steps:
      - name: Test native agent
        working-directory: ci
        run: cargo test --locked --bin native-runner-agent
      - name: Build native agent
        working-directory: ci
        run: cargo build --locked --release --bin native-runner-agent
      - uses: ci/upload-artifact
        with: { name: native-agent-windows, path: ci/target/release/native-runner-agent.exe }

  release:
    needs: [linux, platform, mac-intel, windows]
    if: ${{ vars.RELEASE_ENABLED == 'true' && vars.RELEASE_SOURCE_SHA == ci.sha }}
    vm: *linux
    steps:
      - name: Refuse changes outside the validated platform components
        env:
          RELEASE_BASE: ${{ ci.release_base_sha }}
          SOURCE_SHA: ${{ ci.sha }}
        run: |
          set -eu
          python3 - <<'PY'
          import os, subprocess
          base, head = os.environ['RELEASE_BASE'], os.environ['SOURCE_SHA']
          if not base or not head:
              raise SystemExit('release requires captured base and source SHA')
          paths = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z', base, head]).decode().split('\0')
          prefixes = ('ci/', 'app-lb/', 'artifacts/', 'heyosecret/', 'orchestrator/', '.ci/', '.heyo/')
          outside = [p for p in paths if p and not p.startswith(prefixes)]
          if outside:
              raise SystemExit('platform release cannot authorize unvalidated components: ' + ', '.join(outside))
          PY
      - uses: ci/merge-release
        with:
          manifests: '["ci/Cargo.toml"]'
          token: ${{ secrets.GIT_AUTH_TOKEN }}

  release-archive:
    needs: [release]
    if: ${{ vars.RELEASE_ENABLED == 'true' && vars.RELEASE_SOURCE_SHA == ci.sha }}
    vm: *linux
    timeout-minutes: 120
    outputs:
      archive_id: ${{ steps.archive.outputs.archive-id }}
    steps:
      - id: checkout
        uses: ci/checkout-release
      - name: Build release service
        working-directory: /workspace/ci
        timeout-minutes: 90
        run: cargo build --locked --release --bins
      - name: Package release service
        run: |
          set -eu
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/release/ci" dist/ci
          cp "$CARGO_TARGET_DIR/release/native-runner-agent" dist/native-runner-agent
          cp ci/deploy/start-artifact.sh dist/start-artifact.sh
          printf '%s\n' '#!/bin/sh' 'set -eu' 'exec ./ci' > dist/start.sh
          chmod 755 dist/start.sh
          printf '%s\n' '${{ steps.checkout.outputs.sha }}' > dist/REVISION
          (cd dist && sha256sum ci native-runner-agent start-artifact.sh start.sh > SHA256SUMS)
          tar -C dist -czf ci-service.tar.gz .
      - uses: ci/upload-artifact
        with: { name: ci-linux-release, path: dist }
      - id: archive
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: ci/publish-service-archive
        with:
          path: ci-service.tar.gz
          name: ci-service
          url: ${{ vars.ORCHESTRATOR_URL }}
          user-id: ${{ vars.SERVICE_OWNER }}
          token: ${{ secrets.ORCHESTRATOR_TOKEN }}

  deploy:
    needs: [release-archive]
    if: ${{ vars.RELEASE_ENABLED == 'true' && vars.RELEASE_SOURCE_SHA == ci.sha && vars.DEPLOY_ENABLED == 'true' }}
    vm: *linux
    steps:
      - id: spec
        name: Attach confirmed archive to configured service
        env:
          SERVICE_SPEC: ${{ vars.SERVICE_SPEC }}
          ARCHIVE_ID: ${{ needs.release-archive.outputs.archive_id }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os
          spec = json.loads(os.environ['SERVICE_SPEC'])
          if not isinstance(spec.get('deploy'), dict):
              raise SystemExit('SERVICE_SPEC requires a deploy object')
          archive = os.environ['ARCHIVE_ID'].strip()
          if not archive:
              raise SystemExit('confirmed service archive is missing')
          spec['deploy']['archive_id'] = archive
          with open(os.environ['CI_OUTPUT'], 'a') as output:
              output.write('json=' + json.dumps(spec, separators=(',', ':')) + '\n')
          PY
      - uses: ci/deploy-service
        timeout-minutes: 20
        with:
          url: ${{ vars.ORCHESTRATOR_URL }}
          token: ${{ secrets.ORCHESTRATOR_TOKEN }}
          spec: ${{ steps.spec.outputs.json }}
