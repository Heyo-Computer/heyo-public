# This repository's own CI, and the worked example the README points at: `ci`
# building `ci`.
#
# One job with one product — the release binary. Checks (fmt, clippy, tests) are
# deliberately absent for now; see "Adding checks" in the README, which is also
# where the toolchain caveat that makes them non-trivial is written down.
name: build
on: [submit]

jobs:
  release:
    # The host this orchestrator is running on. `default` is a *host* node, so
    # the `vm:` block below still applies — the build runs in a VM built on this
    # machine, not on the machine itself.
    #
    # Deliberate for this repository: it is the one workflow whose failures are
    # this project's own bug, so it exercises the `default` form on hardware
    # that is by definition present. Point it elsewhere with
    # `uses: <network>/<node>`, or drop the line entirely to inherit whatever
    # network the repository is assigned on /repos.
    uses: default
    vm:
      driver: firecracker
      # Built by the runner's own daemon (`POST /images/build` — docker →
      # export → mke2fs, the `heyvm mvm build` pipeline behind HTTP), on
      # whichever host the job lands on, the first time it lands there. The
      # image is named for the hash of this Dockerfile, its context and
      # size_mb, so an unchanged one is reused and any edit builds a new image
      # — there is nothing to remember to bump, and the host's docker layer
      # cache keeps rebuilds incremental.
      #
      # This replaces `image: ci-rust`, which named a rootfs that had to be
      # built by hand with `heyvm mvm build` on every runner. A host that had
      # never had that run failed every job at VM creation, and because nothing
      # recorded the attempt it looked exactly like a run that was never picked
      # up. See deploy/image/README.md.
      build:
        dockerfile: deploy/image/Dockerfile
        # Defaulted to the Dockerfile's own directory, as `docker build -f`
        # does; spelled out because init.sh being in it is the point.
        context: deploy/image
        # The `--size-mb 6144` from the old hand-run build, carried over: the
        # crate registry under CARGO_HOME grows into the rootfs at runtime, so
        # auto-sizing (tree × 1.2 + 64MB) would leave it no headroom. (Measured
        # August 2026: the toolchain uses ~1GB, leaving 4.7GB free — the
        # registry fits with room to spare.)
        size_mb: 6144
      # `large`, because the one step is a cold cargo build of ~300 crates and
      # rustc parallelizes to the cores it is given. The class is part of the
      # pool fingerprint, so changing it retires the warm medium VMs on its own.
      size_class: large
      # Mounted at /var/cache/ci by the image's init, which is where
      # CARGO_TARGET_DIR points — deliberately *not* /workspace, which `ci`
      # wipes on every checkout. This disk is what makes reusing a warm VM
      # worth anything.
      disk_size_gb: 40
      # No setup_hooks: the toolchain, git and the OpenSSL headers are in the
      # image. Hooks run on every cold VM, so baking them in is the difference
      # between a build that starts in seconds and one that apt-gets a
      # toolchain first.
      #
      # A dependency change is the one thing that must not reuse a warm VM: the
      # cached registry and `target/` in it were resolved against the old
      # lockfile. `rust-toolchain.toml` is listed although this repository has
      # none — a missing file hashes to an explicit marker, so adding one later
      # busts the pool at the moment it most needs busting.
      cache_key_files:
        - Cargo.lock
        - rust-toolchain.toml
    env:
      CARGO_TERM_COLOR: never
    steps:
      # The image's init runs the same guard, but only at boot — a warm VM
      # serves many runs between boots, and the disk fills *while* warm. This
      # step is the per-run half: without it, a pooled VM that crosses the
      # threshold mid-lifetime fails every build with SIGBUS (rustc writes its
      # output through mmap, and a mapped page that can't be backed on a full
      # filesystem kills the process) until the VM happens to be retired.
      # It also refuses to build without the data disk. If /dev/vdb never
      # attached, /var/cache/ci sits on the 6GB rootfs, the build fills it,
      # and rustc dies with an unreadable SIGBUS mid-compile. Failing here
      # instead names the actual problem in one line, twenty minutes earlier.
      - name: Guard the cache disk
        run: |
          df -P "$CARGO_TARGET_DIR" /
          if [ "$(stat -c %d "$CARGO_TARGET_DIR")" = "$(stat -c %d /)" ]; then
            echo "FATAL: $CARGO_TARGET_DIR is on the rootfs — the data disk (/dev/vdb) is not attached." >&2
            echo "The rootfs cannot hold a release target dir; check disk creation on the runner host." >&2
            exit 1
          fi
          usage=$(df -P "$CARGO_TARGET_DIR" | awk 'NR==2 {gsub(/%/,""); print $5}')
          if [ -n "$usage" ] && [ "$usage" -ge 85 ]; then
            echo "cache disk at ${usage}%, wiping $CARGO_TARGET_DIR"
            rm -rf "$CARGO_TARGET_DIR"
          fi
      - name: Build
        # No `. "$HOME/.cargo/env"`: the image puts cargo on PATH through
        # /etc/profile.d, and the daemon runs every step as `sh -lc`, which is a
        # login shell and reads it.
        #
        # `--locked` because the VM is fingerprinted on `Cargo.lock`: resolving
        # a different dependency set than the one the fingerprint was taken
        # from would make the warm VM's cache a claim that is not true.
        # `cargo fetch` first, then a df of both filesystems: the registry
        # lands in CARGO_HOME on the *rootfs*, which the guard step's check
        # deliberately doesn't fail on — so if the rootfs is what filled, the
        # line printed here is the one that says so, adjacent to the failure
        # instead of twenty minutes of compile output above it.
        #
        # On failure, the guest kernel's ring buffer is the one witness to
        # anything the kernel did to the build — an OOM kill, a block-layer
        # I/O error, an ext4 complaint, or a machine-check event injected
        # from the host (delivered to the mapping process as SIGBUS). rustc
        # dying on a signal looks identical from the outside in all four
        # cases; this tail is what tells them apart. Printing it here is
        # safe — step output rides the exec channel, not the serial console
        # that carries the marker protocol.
        run: |
          cargo fetch --locked
          df -P / "$CARGO_TARGET_DIR"
          if ! cargo build --release --locked; then
            echo "=== build failed; guest kernel log tail ==="
            dmesg | tail -100 || true
            df -P / "$CARGO_TARGET_DIR"
            exit 1
          fi
        # A cold build of ~300 crates is well past the 30-minute default. A warm
        # VM reuses the cache on /var/cache/ci and takes a fraction of this.
        timeout-minutes: 60
      # `ci/upload-artifact` tars its `path` relative to the working directory,
      # and CARGO_TARGET_DIR is outside it — so the binary is brought back in
      # rather than the uploader taught about absolute paths.
      - name: Collect the binary
        run: mkdir -p dist && cp "$CARGO_TARGET_DIR/release/ci" dist/ci
      - uses: ci/upload-artifact
        with:
          name: ci
          path: dist
