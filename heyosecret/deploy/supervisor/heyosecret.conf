# supervisord program definition for heyosecret.
#
# Install into your supervisord include dir (typically
# /etc/supervisor/conf.d/heyosecret.conf), then `supervisorctl reread && update`.
#
# In production HeyoSecret usually runs as an app-lb deployment (see
# app-lb/examples/heyosecret.json); this unit is for a host that runs it
# directly. Every value below marked change-me is a secret: fill it in here or
# point HEYOSECRET_CONFIG_PATH at a 0600 TOML file instead.

[program:heyosecret]
command=/usr/local/bin/heyosecret
directory=/var/lib/heyosecret
user=heyosecret

environment=
    RUST_LOG="info",
    HEYOSECRET_SERVER_PORT="4455",
    HEYOSECRET_MIGRATIONS_DIR="/var/lib/heyosecret/migrations",
    HEYOSECRET_DATABASE_URL="postgres://heyosecret:change-me@127.0.0.1:5432/heyosecret_db",
    HEYOSECRET_INTERNAL_API_KEY="change-me",
    HEYOSECRET_MASTER_KEY="change-me"
    ; Keep the leading comma when uncommenting, and no comment on the same line.
    ;
    ; Put an app-lb auth gate in front of the dashboard and set this, or set an
    ; admin password — not both (heyosecret refuses to start with both).
    ; ,HEYOSECRET_DASHBOARD_GATE="1"
    ; ,HEYOSECRET_ADMIN_PASSWORD="change-me"

autostart=true
autorestart=unexpected
startsecs=5
startretries=3
exitcodes=0

stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/heyosecret/heyosecret.log
stderr_logfile=/var/log/heyosecret/heyosecret.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
