              payload["envRefs"]=[envref("APP_LB_DASHBOARD_PASSWORD","app-lb/admin-password"),envref("APP_LB_DAEMON_API_KEY","cloud/internal-api-key"),envref("APP_LB_DISCOVERY_TOKEN","orchestrator/internal-api-key")]
          elif service=="app-obs":
