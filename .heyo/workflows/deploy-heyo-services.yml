name: Deploy Heyo public services

on:
  push:
    branches: [main]
    paths:
      - 'heyosecret/**'
      - 'orchestrator/**'
      - 'heyosecret-client/**'
      - 'app-lb/**'
      - 'app-obs/**'
      - '.heyo/workflows/deploy-heyo-services.yml'
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - all
          - heyosecret
          - orchestrator
          - app-lb
          - app-obs
      forceStaleDeploy:
        description: "Allow deploying a commit that is no longer current on main"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-heyo-public-services
  cancel-in-progress: false

jobs:
  deploy-platform-service:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - target: heyosecret
            paths: heyosecret
          - target: orchestrator
            paths: orchestrator|heyosecret-client
          - target: app-lb
            paths: app-lb
          - target: app-obs
            paths: app-obs
    runs-on: namespace-profile-default
    env:
      ORCHESTRATOR_URL: ${{ secrets.HEYO_ORCHESTRATOR_URL }}
      ORCHESTRATOR_INTERNAL_API_KEY: ${{ secrets.ORCHESTRATOR_INTERNAL_API_KEY }}
      HEYOSECRET_INTERNAL_API_KEY: ${{ secrets.HEYOSECRET_INTERNAL_API_KEY }}
      HEYO_PUBLIC_HOST: ${{ secrets.HEYO_PUBLIC_HOST || 'stage.heyo.computer' }}
      HEYO_TRAEFIK_CERT_RESOLVER: ${{ secrets.HEYO_TRAEFIK_CERT_RESOLVER || 'letsencrypt-http' }}
      HEYO_SERVICE_REGION: ${{ secrets.HEYO_SERVICE_REGION }}
      HEYO_SERVICE_DRIVER: ${{ secrets.HEYO_SERVICE_DRIVER }}
      HEYO_SERVICE_IMAGE: ${{ secrets.HEYO_SERVICE_IMAGE }}
      ORCHESTRATOR_BACKEND_API_URL: ${{ secrets.ORCHESTRATOR_BACKEND_API_URL }}
      ORCHESTRATOR_PROXY_BASE_DOMAINS: ${{ secrets.ORCHESTRATOR_PROXY_BASE_DOMAINS }}
      ORCHESTRATOR_TARGET_OS: ${{ secrets.ORCHESTRATOR_TARGET_OS }}
      ORCHESTRATOR_TARGET_SUPPORTED_DRIVERS: ${{ secrets.ORCHESTRATOR_TARGET_SUPPORTED_DRIVERS }}
      ORCHESTRATOR_TARGET_ARCHIVE_SUPPORTED_DRIVERS: ${{ secrets.ORCHESTRATOR_TARGET_ARCHIVE_SUPPORTED_DRIVERS }}
      ORCHESTRATOR_NATS_URL: ${{ secrets.ORCHESTRATOR_NATS_URL }}
      ORCHESTRATOR_NATS_ENABLED: ${{ secrets.ORCHESTRATOR_NATS_ENABLED }}
      TARGET_HEYO_SERVICE: ${{ matrix.target }}
      TARGET_HEYO_SERVICE_PATHS: ${{ matrix.paths }}
      REQUESTED_HEYO_SERVICE: ${{ inputs.service }}
      FORCE_STALE_SERVICE_DEPLOY: ${{ inputs.forceStaleDeploy }}
      VALIDATED_SERVICE_ARTIFACTS_AVAILABLE: ${{ inputs.validatedServiceArtifactsAvailable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Plan public service deployment
        run: |
          set -eu
          selected=0
          requested="${REQUESTED_HEYO_SERVICE:-}"
          target="${TARGET_HEYO_SERVICE:?}"
          case "$requested" in
            ""|all) ;;
            heyosecret|orchestrator|app-lb|app-obs) ;;
            *) echo "Unsupported requested public service: $requested" >&2; exit 1 ;;
          esac
          if [ -n "$requested" ]; then
            if [ "$requested" = all ] || [ "$requested" = "$target" ]; then selected=1; fi
          else
            if [ -n "${CI_CHANGED_PATHS:-}" ]; then
              changed_paths="$CI_CHANGED_PATHS"
            else
              changed_paths="$({ git diff --name-only "${CI_BEFORE:-${CI_AFTER:-HEAD}^}" "${CI_AFTER:-HEAD}" 2>/dev/null || git diff --name-only HEAD^ HEAD 2>/dev/null || true; git diff --name-only HEAD -- 2>/dev/null || true; } | sort -u)"
            fi
            if [ -n "${CI_REPO_URL:-}" ] && [ -z "$(printf %s "$changed_paths" | tr -d '[:space:]')" ]; then
              selected=1
            elif printf '%s\n' "$changed_paths" | grep -Eq "^(${TARGET_HEYO_SERVICE_PATHS})/|^\.heyo/workflows/deploy-heyo-services\.yml$"; then
              selected=1
            fi
          fi
          printf 'SERVICE_SELECTED=%s\n' "$selected" >> "$GITHUB_ENV"
          printf 'USE_VALIDATED_SERVICE_ARTIFACTS=0\n' >> "$GITHUB_ENV"
          if [ "$selected" = 1 ] && [ "${CI_SOURCE:-}" = git-submit-post-merge ]; then
            if [ "${VALIDATED_SERVICE_ARTIFACTS_AVAILABLE:-0}" != 1 ]; then
              echo "Post-merge deployment requires the validated $target artifact" >&2
              exit 1
            fi
            printf 'USE_VALIDATED_SERVICE_ARTIFACTS=1\n' >> "$GITHUB_ENV"
          fi

      - name: Ensure deployment secret references
        run: |
          set -eu
          [ "${SERVICE_SELECTED:-0}" = 1 ] || { echo "Target not selected."; exit 0; }
          python3 - <<'PY'
          import base64, json, os, secrets, urllib.error, urllib.parse, urllib.request
          target = os.environ["TARGET_HEYO_SERVICE"]
          required = {
              "heyosecret": ["heyosecret/database-url", "heyosecret/master-key"],
              "orchestrator": ["orchestrator/database-url", "orchestrator/jwt-secret", "orchestrator/internal-api-key", "cloud/internal-api-key"],
              "app-lb": ["app-lb/admin-password", "cloud/internal-api-key", "orchestrator/internal-api-key"],
              "app-obs": ["app-lb/admin-password", "app-obs/api-token"],
          }[target]
          generated = {
              "app-lb/admin-password": "Generated app-lb dashboard password",
              "app-obs/api-token": "Generated app-obs API token",
          }
          host = os.environ.get("HEYO_PUBLIC_HOST", "").strip()
          token = os.environ.get("HEYOSECRET_INTERNAL_API_KEY", "").strip() or os.environ.get("ORCHESTRATOR_INTERNAL_API_KEY", "").strip()
          if not host or not token:
              raise SystemExit("HEYO_PUBLIC_HOST and a HeyoSecret metadata API token are required")
          if target == "orchestrator" and not os.environ.get("ORCHESTRATOR_BACKEND_API_URL", "").strip():
              raise SystemExit("ORCHESTRATOR_BACKEND_API_URL is required to deploy orchestrator")
          for path in required:
              url = f"https://{host}/heyosecret/v1/secrets/metadata?{urllib.parse.urlencode({'path': path})}"
              request = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      metadata = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and path in generated:
                      value = secrets.token_urlsafe(32).encode()
                      body = json.dumps({
                          "path": path,
                          "valueBase64": base64.b64encode(value).decode(),
                          "description": generated[path],
                          "actor": "heyo-public-service-deploy",
                          "metadata": {"generated": True, "purpose": "service deployment credential"},
                      }).encode()
                      write = urllib.request.Request(
                          f"https://{host}/heyosecret/v1/secrets/write",
                          data=body,
                          headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                          method="POST",
                      )
                      try:
                          with urllib.request.urlopen(write, timeout=15) as response:
                              result = json.load(response)
                      except urllib.error.HTTPError as write_error:
                          raise SystemExit(f"failed to provision deployment secret {path}: HTTP {write_error.code}") from write_error
                      except (OSError, ValueError) as write_error:
                          raise SystemExit(f"failed to provision deployment secret {path}: {write_error}") from write_error
                      if result.get("path") != path:
                          raise SystemExit(f"unexpected write response for deployment secret {path}")
                      print(f"Provisioned generated deployment secret: {path}")
                      continue
                  raise SystemExit(f"required deployment secret {path} is unavailable: HTTP {error.code}") from error
              except (OSError, ValueError) as error:
                  raise SystemExit(f"failed to verify required deployment secret {path}: {error}") from error
              if metadata.get("path") != path:
                  raise SystemExit(f"unexpected metadata response for deployment secret {path}")
              print(f"Verified deployment secret metadata: {path}")
          PY

      - name: Download validated service artifact
        if: ${{ env.SERVICE_SELECTED == '1' && inputs.validatedServiceArtifactsAvailable == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: selected-service-artifacts-${{ matrix.target }}
          path: validated-selected-service-artifacts

      - name: Restore validated service artifact
        run: |
          set -eu
          [ "${SERVICE_SELECTED:-0}" = 1 ] || { echo "Target not selected."; exit 0; }
          [ "${USE_VALIDATED_SERVICE_ARTIFACTS:-0}" = 1 ] || { echo "Building from this checkout."; exit 0; }
          manifest="$(find validated-selected-service-artifacts -path '*/manifest.json' -type f | head -1 || true)"
          [ -n "$manifest" ] || { echo "Validated artifact is missing manifest.json" >&2; exit 1; }
          archive_name="$(python3 - "$manifest" "$TARGET_HEYO_SERVICE" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          print(next((a.get("archiveName", "") for a in manifest.get("artifacts", []) if a.get("service") == sys.argv[2]), ""))
          PY
          )"
          expected="heyo-${TARGET_HEYO_SERVICE}-linux.tar.gz"
          [ "$archive_name" = "$expected" ] || { echo "Validated manifest does not contain $expected" >&2; exit 1; }
          bundle_dir="$(dirname "$manifest")"
          [ -s "$bundle_dir/files/$archive_name" ] || { echo "Validated bundle is missing $archive_name" >&2; exit 1; }
          mkdir -p dist
          cp "$bundle_dir/files/$archive_name" "dist/$archive_name"

      - name: Install Rust stable
        if: ${{ env.SERVICE_SELECTED == '1' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install app-lb build dependencies
        if: ${{ env.SERVICE_SELECTED == '1' && matrix.target == 'app-lb' }}
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get -o DPkg::Lock::Timeout=120 update
            sudo apt-get -o DPkg::Lock::Timeout=120 install -y cmake libssl-dev pkg-config
          fi

      - name: Test or check selected service
        run: |
          set -eu
          [ "${SERVICE_SELECTED:-0}" = 1 ] || { echo "Target not selected."; exit 0; }
          [ "${USE_VALIDATED_SERVICE_ARTIFACTS:-0}" != 1 ] || { echo "Using artifact validated before merge."; exit 0; }
          case "$TARGET_HEYO_SERVICE" in
            heyosecret) cargo test --locked --manifest-path heyosecret/Cargo.toml ;;
            orchestrator) cargo check --locked --manifest-path orchestrator/Cargo.toml --bin orchestrator ;;
            app-lb) cargo test --locked --manifest-path app-lb/Cargo.toml -p app-lb ;;
            app-obs) cargo test --locked --manifest-path app-obs/Cargo.toml ;;
          esac

      - name: Build selected release binary
        run: |
          set -eu
          [ "${SERVICE_SELECTED:-0}" = 1 ] || { echo "Target not selected."; exit 0; }
          [ "${USE_VALIDATED_SERVICE_ARTIFACTS:-0}" != 1 ] || { echo "Using artifact built before merge."; exit 0; }
          cargo build --locked --release --manifest-path "$TARGET_HEYO_SERVICE/Cargo.toml" --bin "$TARGET_HEYO_SERVICE"

      - name: Package selected service archive
        run: |
          set -eu
          [ "${SERVICE_SELECTED:-0}" = 1 ] || { echo "Target not selected."; exit 0; }
          [ "${USE_VALIDATED_SERVICE_ARTIFACTS:-0}" != 1 ] || { echo "Using restored archive."; exit 0; }
          service="$TARGET_HEYO_SERVICE"
          package="dist/heyo-$service"
          rm -rf "$package"
          mkdir -p "$package"
          cp "$service/target/release/$service" "$package/$service"
          if [ -d "$service/migrations" ]; then
            mkdir -p "$package/migrations"
            cp -R "$service/migrations/." "$package/migrations/"
          fi
          case "$service" in
            heyosecret) cat > "$package/start.sh" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          export HEYOSECRET_SERVER_PORT="${HEYOSECRET_SERVER_PORT:-8080}"
          export HEYOSECRET_MIGRATIONS_DIR="${HEYOSECRET_MIGRATIONS_DIR:-/workspace/migrations}"
          : "${HEYO_SERVICE_LOG:=/workspace/service.log}"
          touch "$HEYO_SERVICE_LOG" 2>/dev/null || true
          exec >>"$HEYO_SERVICE_LOG" 2>&1
          exec ./heyosecret
          EOF
              ;;
            orchestrator) cat > "$package/start.sh" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          export ORCHESTRATOR_SERVER_PORT="${ORCHESTRATOR_SERVER_PORT:-8080}"
          export ORCHESTRATOR_MIGRATIONS_DIR="${ORCHESTRATOR_MIGRATIONS_DIR:-/workspace/migrations}"
          : "${HEYO_SERVICE_LOG:=/workspace/service.log}"
          touch "$HEYO_SERVICE_LOG" 2>/dev/null || true
          exec >>"$HEYO_SERVICE_LOG" 2>&1
          exec ./orchestrator
          EOF
              ;;
            app-lb)
              cat > "$package/bootstrap-state.json" <<'EOF'
          [
            {
              "id": "app-lb-admin",
              "routes": [{"path_prefix": "/"}],
              "upstreams": ["127.0.0.1:9090"],
              "health": {"path": "/healthz", "timeout_secs": 2}
            }
          ]
          EOF
              cat > "$package/start.sh" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          : "${APP_LB_STATE_PATH:=/workspace/state/app-lb-state.json}"
          : "${APP_LB_SECRETS_PATH:=/workspace/state/app-lb-secrets.json}"
          : "${APP_LB_TOKENS_PATH:=/workspace/state/app-lb-tokens.json}"
          : "${APP_LB_GUARD_PATH:=/workspace/state/app-lb-guard.json}"
          : "${APP_LB_AUTH_KEY:=/workspace/state/app-lb-auth-key}"
          : "${APP_LB_ACME_DIR:=/workspace/state/acme}"
          : "${APP_LB_BUILD_DIR:=/workspace/state/builds}"
          : "${APP_LB_MOUNTS_DIR:=/workspace/state/mounts}"
          : "${APP_LB_WORKSPACES_DIR:=/workspace/state/workspaces}"
          export APP_LB_STATE_PATH APP_LB_SECRETS_PATH APP_LB_TOKENS_PATH APP_LB_GUARD_PATH
          export APP_LB_AUTH_KEY APP_LB_ACME_DIR APP_LB_BUILD_DIR APP_LB_MOUNTS_DIR APP_LB_WORKSPACES_DIR
          if [ -z "${APP_LB_DAEMON_URL:-}" ]; then
            host_gateway="$(ip -4 route show default | awk 'NR == 1 { print $3 }')"
            if [ -z "$host_gateway" ]; then
              echo "cannot determine the host gateway for APP_LB_DAEMON_URL" >&2
              exit 1
            fi
            APP_LB_DAEMON_URL="http://${host_gateway}:3000"
            export APP_LB_DAEMON_URL
          fi
          mkdir -p "$(dirname "$APP_LB_STATE_PATH")" "$APP_LB_ACME_DIR" "$APP_LB_BUILD_DIR" "$APP_LB_MOUNTS_DIR" "$APP_LB_WORKSPACES_DIR"
          state_dir="${APP_LB_STATE_PATH%.*}.d"
          if [ ! -e "$APP_LB_STATE_PATH" ] && [ ! -d "$state_dir" ]; then
            cp /workspace/bootstrap-state.json "$APP_LB_STATE_PATH"
          fi
          exec ./app-lb
          EOF
              ;;
            app-obs) cat > "$package/start.sh" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          mkdir -p "${APP_OBS_DATA_DIR:-/workspace/data}"
          : "${HEYO_SERVICE_LOG:=/workspace/service.log}"
          touch "$HEYO_SERVICE_LOG" 2>/dev/null || true
          exec >>"$HEYO_SERVICE_LOG" 2>&1
          exec ./app-obs
          EOF
              ;;
          esac
          chmod +x "$package/$service" "$package/start.sh"
          tar -C "$package" -czf "dist/heyo-$service-linux.tar.gz" .

      - name: Prepare selected service artifact
        run: |
          set -eu
          [ "${SERVICE_SELECTED:-0}" = 1 ] || { echo "Target not selected."; exit 0; }
          [ "${USE_VALIDATED_SERVICE_ARTIFACTS:-0}" != 1 ] || { echo "Validation artifact already persisted."; exit 0; }
          archive_name="heyo-${TARGET_HEYO_SERVICE}-linux.tar.gz"
          archive="dist/$archive_name"
          test -s "$archive"
          rm -rf dist/selected-service-artifacts
          mkdir -p dist/selected-service-artifacts/files
          cp "$archive" "dist/selected-service-artifacts/files/$archive_name"
          bytes="$(wc -c < "$archive" | tr -d ' ')"
          python3 - "$TARGET_HEYO_SERVICE" "$archive_name" "$bytes" <<'PY' > dist/selected-service-artifacts/manifest.json
          import json, os, sys
          print(json.dumps({"schemaVersion":1,"gitSha":os.environ.get("GITHUB_SHA", ""),"source":os.environ.get("CI_SOURCE", ""),"artifacts":[{"service":sys.argv[1],"archiveName":sys.argv[2],"sizeBytes":int(sys.argv[3])}]}, separators=(",", ":")))
          PY

      - name: Upload selected service artifact
        if: ${{ env.SERVICE_SELECTED == '1' && inputs.validatedServiceArtifactsAvailable != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: selected-service-artifacts-${{ matrix.target }}
          path: dist/selected-service-artifacts

      - name: Deploy selected service through Heyo orchestrator
        run: |
          set -eu
          [ "${SERVICE_SELECTED:-0}" = 1 ] || { echo "Target not selected."; exit 0; }
          if [ "${CI_SOURCE:-}" = git-submit ]; then
            echo "$TARGET_HEYO_SERVICE was built and tested for git submit; cutover waits for the merged revision."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, subprocess, sys, time, urllib.error, urllib.request, uuid

          def required(name):
              value = os.environ.get(name, "").strip()
              if not value: raise SystemExit(f"missing required configuration: {name}")
              return value
          def canonical(url):
              if url.startswith("git@github.com:"): return "https://github.com/" + url.removeprefix("git@github.com:")
              if url.startswith("ssh://git@github.com/"): return "https://github.com/" + url.removeprefix("ssh://git@github.com/")
              return url
          def envref(name, path): return f"{name}=heyosecret://{path}@active"
          def deploy(endpoint, key, payload):
              payload["async"] = True
              result = subprocess.run(["curl","--connect-timeout","15","--max-time","420","--fail-with-body","--show-error","--silent","-X","POST","-H",f"Authorization: Bearer {key}","-H","Content-Type: application/json","--data-binary","@-",f"{endpoint}/orchestration/services/deployments"], input=json.dumps(payload), text=True, capture_output=True)
              if result.returncode:
                  print(result.stdout); print(result.stderr, file=sys.stderr); raise SystemExit(result.returncode)
              response=json.loads(result.stdout or "{}")
              deployment_id=response.get("deploymentId") or payload["deploymentId"]
              status_url=response.get("statusUrl") or f"/orchestration/services/deployments/{deployment_id}"
              if status_url.startswith("/"): status_url=endpoint+status_url
              print(f"Accepted {payload['serviceId']} deployment {deployment_id}; polling {status_url}", flush=True)
              seen=set(); deadline=time.monotonic()+1200
              while time.monotonic()<deadline:
                  poll=subprocess.run(["curl","--connect-timeout","15","--max-time","30","--fail-with-body","--show-error","--silent","-H",f"Authorization: Bearer {key}",status_url], text=True, capture_output=True)
                  if poll.returncode:
                      time.sleep(5); continue
                  try:
                      status=json.loads(poll.stdout or "{}")
                  except json.JSONDecodeError:
                      time.sleep(5); continue
                  for event in status.get("events") or []:
                      if event.get("id") in seen: continue
                      seen.add(event.get("id"))
                      print(f"[{event.get('status')}] {event.get('phase')}: {event.get('message')}", flush=True)
                  if status.get("status") in {"passed","completed","succeeded"}: return
                  if status.get("status") in {"failed","error"}: raise SystemExit(json.dumps(status,indent=2)[-4000:])
                  time.sleep(5)
              raise SystemExit(f"deployment {deployment_id} exceeded the workflow deadline")

          service=required("TARGET_HEYO_SERVICE"); public_host=required("HEYO_PUBLIC_HOST")
          endpoint=(os.environ.get("ORCHESTRATOR_URL") or f"https://{public_host}/orchestrator").rstrip("/")
          key=required("ORCHESTRATOR_INTERNAL_API_KEY"); repo=canonical(required("CI_REPO_URL"))
          git_sha=subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          archive_name=f"heyo-{service}-linux.tar.gz"
          deployment_id=f"svc-{service}-{uuid.uuid4().hex[:12]}"
          start_command="i=0; until mountpoint -q /workspace && [ -x /workspace/start.sh ]; do sudo -n sh -c 'modprobe 9p 2>/dev/null; modprobe 9pnet 2>/dev/null; modprobe 9pnet_virtio 2>/dev/null; mount -a 2>/dev/null || true' >/dev/null 2>&1 || true; i=$((i + 1)); if [ \"$i\" -ge 300 ]; then echo 'workspace mount did not become ready within 300 seconds' >&2; exit 1; fi; sleep 1; done; cd /workspace; exec ./start.sh"
          priority={"heyosecret":10010,"orchestrator":10010,"app-lb":10010,"app-obs":10010}[service]
          if service == "app-lb":
              route={"host":f"app-lb.{public_host}","pathPrefix":"/metrics","entryPoints":["websecure"],"stripPrefix":False,"passHostHeader":True,"priority":priority}
          else:
              route={"host":public_host,"pathPrefix":f"/{service}","entryPoints":["websecure"],"stripPrefix":True,"passHostHeader":False,"priority":priority}
          if os.environ.get("HEYO_TRAEFIK_CERT_RESOLVER"): route["certResolver"]=os.environ["HEYO_TRAEFIK_CERT_RESOLVER"]
          payload={"serviceId":service,"deploymentId":deployment_id,"userId":os.environ.get("HEYO_SERVICE_USER_ID","heyo-system"),"accountId":os.environ.get("HEYO_SERVICE_ACCOUNT_ID","heyo-system"),"name":f"heyo-{service}","archiveName":archive_name,"archiveBytesBase64":base64.b64encode(open(f"dist/{archive_name}","rb").read()).decode(),"region":os.environ.get("HEYO_SERVICE_REGION") or "EU","driver":os.environ.get("HEYO_SERVICE_DRIVER") or "libvirt","image":os.environ.get("HEYO_SERVICE_IMAGE") or "ubuntu:24.04","ports":[8080],"workingDirectory":"/","startCommand":start_command,"sizeClass":os.environ.get("HEYO_SERVICE_SIZE_CLASS","small"),"ttlSeconds":0,"healthPath":"/health","healthTimeoutSeconds":900,"drainSeconds":30,"retirePrevious":True,"retirePreviousAsync":True,"deletePrevious":True,"metadata":{"gitSha":git_sha,"gitRef":os.environ.get("GITHUB_REF", ""),"repositoryUrl":repo,"workflow":"Deploy Heyo public services"},"revisionGuard":{"repositoryUrl":repo,"ref":required("CI_REF"),"expectedSha":required("CI_AFTER"),"force":os.environ.get("FORCE_STALE_SERVICE_DEPLOY","").lower() in {"1","true"}},"env":{},"envRefs":[],"route":route}
          if service=="heyosecret":
              payload["env"]={"HEYOSECRET_SERVER_PORT":"8080","HEYOSECRET_INTERNAL_API_KEY":os.environ.get("HEYOSECRET_INTERNAL_API_KEY") or key,"HEYOSECRET_MIGRATIONS_DIR":"/workspace/migrations","HEYOSECRET_COOKIE_SECURE":"true"}
              payload["envRefs"]=[envref("HEYOSECRET_DATABASE_URL","heyosecret/database-url"),envref("HEYOSECRET_MASTER_KEY","heyosecret/master-key")]
          elif service=="orchestrator":
              nats_url=os.environ.get("ORCHESTRATOR_NATS_URL","").strip()
              nats_enabled=os.environ.get("ORCHESTRATOR_NATS_ENABLED","").strip().lower() in {"1","true","yes"} and bool(nats_url)
              proxy_base_domains=os.environ.get("ORCHESTRATOR_PROXY_BASE_DOMAINS","").strip() or f"{public_host},heyo.computer"
              payload["env"]={"ORCHESTRATOR_SERVER_PORT":"8080","ORCHESTRATOR_MIGRATIONS_DIR":"/workspace/migrations","ORCHESTRATOR_TRAEFIK_DYNAMIC_CONFIG_DIR":"/opt/heyo-deploy/orchestrator/traefik-dynamic.d","ORCHESTRATOR_SERVICE_STATE_DIR":"/opt/heyo-deploy/orchestrator/service-state","ORCHESTRATOR_REPOSITORY_CLONE_ROOT":"/workspace/repos","ORCHESTRATOR_PUBLIC_URL":f"https://{public_host}/orchestrator","ORCHESTRATOR_PROXY_BASE_DOMAINS":proxy_base_domains,"CLOUD_INTERNAL_URL":f"https://{public_host}/cloud","ORCHESTRATOR_CLOUD_INTERNAL_URL":f"https://{public_host}/cloud","ORCHESTRATOR_HEYOSECRET_URL":f"https://{public_host}/heyosecret","HEYO_ORCHESTRATOR_DEPLOYMENT_GIT_SHA":git_sha,"ORCHESTRATOR_NATS_ENABLED":str(nats_enabled).lower()}
              if nats_enabled: payload["env"]["ORCHESTRATOR_NATS_URL"]=nats_url
