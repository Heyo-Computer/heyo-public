name: app-lb CI

on:
  push:
    branches:
      - main
    paths:
      - 'app-lb/**'
      - '.heyo/workflows/app-lb.yml'

jobs:
  app-lb:
    name: Test app-lb
    runs-on: namespace-profile-default
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y cmake libssl-dev pkg-config

      - name: Test app-lb
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path app-lb/Cargo.toml -p app-lb
          cargo test --locked --manifest-path app-lb/heyctl/Cargo.toml

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Test TypeScript SDK
        working-directory: app-lb/sdk/typescript
        run: |
          set -euo pipefail
          npm ci
          npm test
