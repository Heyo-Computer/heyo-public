name: queue-fn CI

on:
  push:
    branches:
      - main
    paths:
      - 'queue-fn/**'
      - '.heyo/workflows/queue-fn.yml'

jobs:
  queue-fn:
    name: Test queue-fn
    runs-on: namespace-profile-default
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test queue-fn
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path queue-fn/Cargo.toml
