# NATS server for queue-fn, running directly on the host.
#
# Sized for the one thing queue-fn asks of NATS: three JetStream file streams
# (QFN_EVENTS, QFN_RESULTS, QFN_DLQ) and one pull consumer per registered
# function. Nothing here assumes a cluster; see the note on `listen` before
# widening it.
#
# Edits: `supervisorctl signal HUP nats-server` picks up most keys in place.
# `listen`, `http`, and `jetstream.store_dir` need a full restart
# (`supervisorctl restart nats-server`), which drops every client connection.

server_name: qfn-nats-1

# Loopback only. queue-fn defaults to `nats://127.0.0.1:4222` and has to run on
# the same host as heyvmd regardless (it needs `guest_ip`, which the daemon only
# exposes locally), so there is nothing to gain from listening wider. Opening
# this up is a TLS-and-real-accounts decision, not a listen-address change.
listen: 127.0.0.1:4222

# Monitoring endpoints: /varz, /connz, /jsz?streams=1 — the last one is the
# quickest answer to "is the backlog in the stream or in the dispatcher?".
# Unauthenticated by design, hence loopback.
http: 127.0.0.1:8222

# Under /var/lib rather than /run: nothing here creates /run/nats on boot, and
# the file's only real use is `nats-server --signal reload=<path>` as an
# alternative to `supervisorctl signal HUP nats-server`.
pid_file: "/var/lib/nats/nats-server.pid"

# No logfile: stdout/stderr go to supervisor, which captures and rotates them.
# Supervisor's capture adds no timestamps of its own, so the server supplies
# them.
logtime: true
debug: false
trace: false

# queue-fn caps invoke payloads at 4 KiB (`PAYLOAD_CEILING_BYTES`), but result
# messages carry captured stdout/stderr and are not capped nearly that tightly.
# 1 MiB is the server default; stated explicitly so raising it is a deliberate
# edit rather than an inherited default nobody looked at.
max_payload: 1MB
max_control_line: 4KB
max_connections: 1024

# A dead dispatcher is detected in ~4 minutes rather than held open until TCP
# gives up, which matters because `WorkQueue` retention permits only one
# consumer per subject — a zombie connection holding one blocks the replacement.
ping_interval: "2m"
ping_max: 2

jetstream {
  # Must exist and be writable by the `nats` user before first start —
  # supervisor creates nothing. nats-server will make the `jetstream`
  # subdirectory itself, but not its parent.
  store_dir: "/var/lib/nats/jetstream"

  # Server-wide ceiling. Every stream on this box is `StorageType::File`, so
  # this is the limit that actually binds; the per-account `max_file` values
  # below divide it, and their sum should not exceed it.
  max_file_store: 8GB

  # Memory store stays modest: queue-fn creates no memory streams, this only
  # covers what the server itself needs.
  max_memory_store: 256MB
}

accounts {
  # queue-fn gets its own account, not just its own user. Account isolation is
  # what keeps `QFN_EVENTS`' WorkQueue retention safe: another tenant cannot
  # bind a second consumer to `qfn.invoke.*` and start eating dispatches, and it
  # cannot see the payloads either.
  QFN: {
    # An explicit share of the server-wide store, so a DLQ filling up during an
    # outage cannot starve the CI account below it (and vice versa). QFN_RESULTS
    # expires at 1h and QFN_DLQ at 7d, so steady state is far under this.
    jetstream: {
      max_file: 6GB
      max_mem: 192MB
    }
    users: [
      # Expanded from the environment the supervisor program sources out of
      # /etc/nats/nats.env. A bcrypt hash works here too —
      # `nats server passwd` prints one — if a plaintext secret on disk is not
      # acceptable.
      { user: "qfn", password: $QFN_NATS_PASSWORD }

      # Per-subject permissions are deliberately omitted: inside its own
      # account the qfn user is already alone, and an incomplete allow-list is
      # a live hazard here — it must cover `$JS.API.>` and `_INBOX.>` as well
      # as `qfn.>`, or stream creation fails at startup with a timeout that
      # reads like a network problem. If you do add them:
      #
      #   permissions: {
      #     publish:   { allow: ["qfn.>", "$JS.API.>"] }
      #     subscribe: { allow: ["qfn.>", "_INBOX.>"] }
      #   }
    ]
  }

  # The CI orchestrator (~/Projects/ci). Its own account for the same reason
  # queue-fn has one: CI_JOBS is WorkQueue-retained too, and "one consumer per
  # subject" is an invariant a second tenant can break by accident.
  #
  # It must not use the system credential below. JetStream cannot be enabled on
  # the system account at all, so a client that authenticates as `sys` reaches a
  # server with no streams API to call — `get_or_create_stream("CI_JOBS")` is
  # the first thing ci does after connecting, and it fails there every time.
  CI: {
    # CI_JOBS deletes on ack and CI_EVENTS expires at 24h; step logs and
    # artifacts go to disk via CI_LOG_DIR/CI_ARTIFACT_DIR rather than through
    # NATS, so ci's real footprint here is small.
    jetstream: {
      max_file: 2GB
      max_mem: 64MB
    }
    users: [
      { user: "ci", password: $CI_NATS_PASSWORD }
    ]
  }

  # System account: `nats server report jetstream`, $SYS.> events, and nothing
  # else. It has no JetStream and no application subjects — it is not a
  # fallback account for a service that could not authenticate elsewhere.
  SYS: {
    users: [
      { user: "sys", password: $NATS_SYS_PASSWORD }
    ]
  }
}

system_account: SYS

# No `no_auth_user`: with accounts defined, an unauthenticated client is
# rejected rather than silently landing in a default account. queue-fn supplies
# its credential through QFN_NATS_USER/QFN_NATS_PASSWORD, which it prefers over
# URL userinfo anyway.
