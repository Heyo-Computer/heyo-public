; supervisord program for the NATS server queue-fn dispatches through.
;
;   install -m 0644 deploy/nats-server.supervisor.conf \
;       /etc/supervisor/conf.d/nats-server.conf
;   supervisorctl reread && supervisorctl update
;
; Prerequisites, none of which supervisor creates for you (unlike systemd's
; StateDirectory): a `nats` system user, /var/lib/nats and /var/log/nats owned
; by it, and /etc/nats/nats.env at 0640 root:nats holding one password per
; account in nats-server.conf — QFN_NATS_PASSWORD, CI_NATS_PASSWORD, and
; NATS_SYS_PASSWORD. An unset one is a config parse error ("variable reference
; for 'X' cannot be found") rather than an empty password, so adding an account
; without its variable fails at start rather than at auth time.

[program:nats-server]

; The credentials are sourced at exec time rather than declared in
; `environment=`, because this file is world-readable and supervisord reports a
; program's environment to anyone who can reach its control socket. `set -a`
; exports every assignment in nats.env so the config's $QFN_NATS_PASSWORD and
; $NATS_SYS_PASSWORD expand; `exec` replaces the shell, so the pid supervisor
; tracks is nats-server itself and stopsignal reaches the server directly.
command=/bin/sh -c 'set -a; . /etc/nats/nats.env; set +a; exec /usr/local/bin/nats-server --config /etc/nats/nats-server.conf'

user=nats
directory=/var/lib/nats

autostart=true
autorestart=true

; Lower priority starts earlier. Give queue-fn's own program a higher number:
; it exits at startup if it cannot reach NATS and create its streams.
priority=100

; nats-server has its listener up in well under a second, so anything that dies
; inside 5s is a config error rather than a flake — startretries stops us
; restarting into the same failure forever.
startsecs=5
startretries=3

; SIGINT is nats-server's clean shutdown: it flushes JetStream file state before
; exiting. stopwaitsecs is the grace period before SIGKILL, sized for a large
; file store rather than for the empty one you will test against.
stopsignal=INT
stopwaitsecs=30

; Config reload without dropping the dispatcher's connection — how a password
; rotation lands:  supervisorctl signal HUP nats-server
;
; Restarting through supervisor works too, but it drops every client connection,
; and a reconnecting dispatcher has to re-bind its pull consumer.

; Log capture. There is no journald in this arrangement, so rotation is set here
; and `logtime: true` in nats-server.conf supplies the timestamps.
redirect_stderr=true
stdout_logfile=/var/log/nats/nats-server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; Two things systemd would have done that supervisor cannot, worth knowing you
; are giving up:
;
; 1. File descriptors. There is no per-program rlimit; children inherit
;    supervisord's own. nats-server wants one fd per client connection plus one
;    per open stream/consumer block file, and the default 1024 is reachable with
;    a few hundred functions. Raise it globally in /etc/supervisor/supervisord.conf:
;
;      [supervisord]
;      minfds=65536
;
;    supervisord raises its soft limit to `minfds` at startup and refuses to
;    start if the hard limit is lower, so the ceiling may also need lifting in
;    /etc/security/limits.conf or supervisord's own launcher.
;
; 2. Sandboxing. No ProtectSystem, no capability bounding set, no syscall
;    filter — the process is confined only by the `nats` user's permissions.
;    Keeping the listener on loopback (see nats-server.conf) is doing more of
;    the security work here than it would under a hardened unit.
