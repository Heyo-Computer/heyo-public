[package]
name = "queue-fn"
version = "0.1.0"
edition = "2024"

[dependencies]
# The heyvm daemon boundary. Same version app-lb pins, so the two apps agree on
# SandboxInfo/SandboxStatus semantics.
heyo-sdk = "0.1.6"

# JetStream. Pinned to the version heyvm itself links (mvm-ctrl/Cargo.toml) so a
# future decision to share a stream is a routing change, not a version upgrade.
async-nats = "0.47"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "signal",
] }

# 0.7, not 0.8: path params are `:id`, not `{id}`.
axum = "0.7"
http = "1"

arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
