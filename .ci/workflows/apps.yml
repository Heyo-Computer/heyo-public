# Build the `app-lb` and `app-obs` release binaries and upload them as
# artifacts.
#
# Submitted from the repository root, with an ordinary bundle:
#
#     git submit
#
# **No `--archive`**, unlike the private `heyo` monorepo. This repository's whole
# history bundles to 2.7 MB against a 64 MB `CI_MAX_SOURCE_BYTES`, so the default
# payload fits with room to spare — which matters twice here: `.git` exists in
# the guest, so the version stamps below are real `git describe` output, and the
# change set is real, so the filtering described next actually happens.
#
# ## Two jobs, one file, and why each is gated
#
# `app-lb` and `app-obs` are separate cargo workspaces with separate lockfiles.
# They are in one workflow because they are the two halves of one deployed
# thing — the load balancer and the observability service it feeds — so "did
# the platform build" is one useful answer, and one run page shows it.
#
# What that must *not* mean is rebuilding both whenever either moves. So the
# gating happens twice, at two scopes:
#
#  - `on: submit: paths:` decides whether this workflow runs **at all**. A
#    commit touching only `codegraph/` or `printer/` starts nothing here.
#  - each job's `if: changed(...)` decides whether **that job** runs. A commit
#    touching only `app-obs/` starts this workflow, skips the `app-lb` job, and
#    the run still ends green — a run of nothing but skipped jobs is a success,
#    which is exactly the answer a commit that changed nothing relevant deserves.
#
# `changed()` runs the same glob matcher as `paths:`, so a job's guard and the
# workflow's filter cannot disagree about what a pattern covers. Both are true
# when the change set is unknown (a `--archive` submit, a root commit, a
# `--dirty` submit), because a job that silently skips on those is a green tick
# on work nothing did. `${{ ci.changes_reason }}` says which case a run is in.
#
# Each job's guard lists the shared image and this file alongside its own
# subtree. That is not redundancy with `paths:` — without it, editing the
# Dockerfile would start the workflow and then skip both jobs, which is the one
# change that genuinely must rebuild both.
name: apps

on:
  submit:
    paths:
      # app-lb's subtree covers `app-lb/heyctl/` too — `**` crosses segments.
      # Neither workspace has a path dependency outside its own directory, so
      # unlike the `heyo` monorepo there is no sibling crate to list here.
      - 'app-lb/**'
      - 'app-obs/**'
      # This workflow and the image both jobs build in — named precisely rather
      # than as `.ci/**`, so adding a workflow for another crate here does not
      # rebuild these.
      - '.ci/workflows/apps.yml'
      - '.ci/image/apps/**'

jobs:
  # ---------------------------------------------------------------------------
  # app-lb — the proxy, plus `heyctl`, the CLI and client SDK for its admin API.
  # ---------------------------------------------------------------------------
  app-lb:
    if: ${{ changed('app-lb/**', '.ci/workflows/apps.yml', '.ci/image/apps/**') }}
    # Any online host in the network the repository is assigned on /repos.
    # Deliberately not pinned: nothing here needs a particular machine, and
    # pinning would idle the build behind one host's queue. Add
    # `uses: <network>/<node>` if a specific runner is wanted.
    vm:
      driver: firecracker
      build:
        dockerfile: .ci/image/apps/Dockerfile
        # Defaulted to the Dockerfile's own directory, as `docker build -f`
        # does; spelled out because init.sh being in it is the point.
        context: .ci/image/apps
        # 10 GB, matching the `app-obs` job below because both share this image
        # and the size is part of what names it — two different values would
        # build two rootfs images from identical bytes. Sized for the worse of
        # the two: the rootfs holds CARGO_HOME, and the registry grows into it
        # at runtime on top of a ~1 GB toolchain.
        size_mb: 10240
      # `large` (4 CPU, 8 GB). 572 crates, and three of them are C projects
      # built from source — vendored OpenSSL, aws-lc-sys and zlib-ng — which
      # parallelise to the cores they are given. The class is part of the pool
      # fingerprint, so changing it retires the warm VMs of the old class on its
      # own.
      size_class: large
      # Mounted at /var/cache/ci by the image's init, which is where
      # CARGO_TARGET_DIR points — deliberately *not* /workspace, which `ci`
      # wipes on every checkout. This disk is what makes reusing a warm VM worth
      # anything. 30 GB against a measured 1.3 GB debug target dir; the margin
      # is how many reuses fit before init.sh's 85% guard wipes it, since cargo
      # never garbage-collects a `target/`.
      disk_size_gb: 30
      # 4 hours, comfortably past this job's 90-minute timeout.
      #
      # Explicit because the default (`CI_VM_TTL_SECONDS`, 3600) is shorter than
      # a cold build here, and whether the orchestrator's renewal loop actually
      # extends it depends on the *runner's* heyvmd being new enough: the TTL
      # used to be computed as `started_at + ttl`, an uptime cap that renewal
      # could not move, and a build past the cap was reaped mid-compile. That is
      # fixed in mvm-ctrl (`fix: dont truncate live disks, accurate ttl`), but
      # this workflow cannot see which build a given runner is on. A create-time
      # TTL is honoured either way, so this is correct against both.
      ttl_seconds: 14400
      # A dependency change is the one thing that must not reuse a warm VM: the
      # cached registry and target/ in it were resolved against the old
      # lockfile. Resolved against the repository root, so these are monorepo
      # paths.
      #
      # Both manifests, not just the lockfile. `heyctl` is a workspace *member*,
      # so cargo records its version in Cargo.lock but not its contents: editing
      # its feature list changes what gets compiled without moving the lockfile
      # by one byte. The root manifest carries `[workspace.dependencies]` for
      # the same reason.
      #
      # The two `rust-toolchain.toml` paths are listed although neither exists —
      # a missing file hashes to an explicit marker, so adding one later busts
      # the pool at the moment it most needs busting. Both locations, because
      # cargo searches upward from the working directory and would find either.
      cache_key_files:
        - app-lb/Cargo.lock
        - app-lb/Cargo.toml
        - app-lb/heyctl/Cargo.toml
        - app-lb/rust-toolchain.toml
        - rust-toolchain.toml
    env:
      CARGO_TERM_COLOR: never
    # The job needs headroom over the sum of its steps. A cold build compiles
    # OpenSSL and aws-lc from source before it reaches the first Rust crate that
    # needs them; a warm VM reuses /var/cache/ci and relinks.
    timeout-minutes: 90
    steps:
      # The image's init runs the same guard, but only at boot — a warm VM
      # serves many runs between boots, and the disk fills *while* warm. Without
      # this a pooled VM that crosses the threshold mid-lifetime fails every
      # build with SIGBUS (rustc writes its output through mmap, and a mapped
      # page that cannot be backed on a full filesystem kills the process) until
      # the VM happens to be retired.
      #
      # It also refuses to build without the data disk at all. If /dev/vdb never
      # attached, /var/cache/ci sits on the 10 GB rootfs alongside the toolchain
      # and the registry, and a build that fills it dies with an unreadable
      # SIGBUS mid-compile. Failing here names the actual problem in one line.
      - name: Guard the cache disk
        run: |
          df -P "$CARGO_TARGET_DIR" /
          if [ "$(stat -c %d "$CARGO_TARGET_DIR")" = "$(stat -c %d /)" ]; then
            echo "FATAL: $CARGO_TARGET_DIR is on the rootfs — the data disk (/dev/vdb) is not attached." >&2
            echo "Check disk creation on the runner host." >&2
            exit 1
          fi
          usage=$(df -P "$CARGO_TARGET_DIR" | awk 'NR==2 {gsub(/%/,""); print $5}')
          if [ -n "$usage" ] && [ "$usage" -ge 85 ]; then
            echo "cache disk at ${usage}%, wiping $CARGO_TARGET_DIR"
            rm -rf "$CARGO_TARGET_DIR"
          fi

      - name: Build
        # No `. "$HOME/.cargo/env"`: the image puts cargo on PATH through
        # /etc/profile.d, and the daemon runs every step as `sh -lc`, which is a
        # login shell and reads it.
        #
        # **Absolute, not `app-lb`.** Unlike GitHub, `ci` uses
        # `working-directory:` verbatim — it renders `cd <value> && …` and does
        # not join it onto the workspace — so a relative value is resolved from
        # the login shell's home directory and the step dies on `cd: no such
        # file`. /workspace is where the source is extracted.
        working-directory: /workspace/app-lb
        # `--workspace --bins`, and both halves matter. Without `--workspace`,
        # cargo builds only the root package in a workspace that has one, so
        # `heyctl` — a member, and a shipped product in its own right — would
        # silently not be built. Without `--bins`, the build also compiles the
        # `[[example]]` and test targets, none of which ship.
        #
        # `--locked` because the VM is fingerprinted on `Cargo.lock`: resolving
        # a different dependency set than the one the fingerprint was taken from
        # would make the warm VM's cache a claim that is not true.
        #
        # `cargo fetch` first, then a df of both filesystems: the registry lands
        # in CARGO_HOME on the *rootfs*, which the guard step's check
        # deliberately does not fail on — so if the rootfs is what filled, the
        # line printed here is the one that says so, adjacent to the failure
        # rather than under a screen of compile output.
        #
        # On failure, the guest kernel's ring buffer is the one witness to
        # anything the kernel did to the build — an OOM kill, a block-layer I/O
        # error, an ext4 complaint, or a machine-check event injected from the
        # host (delivered to the mapping process as SIGBUS). rustc dying on a
        # signal looks identical from the outside in all four cases; this tail
        # is what tells them apart. Printing it here is safe — step output rides
        # the exec channel, not the serial console that carries the marker
        # protocol.
        run: |
          cargo fetch --locked
          df -P / "$CARGO_TARGET_DIR"
          if ! cargo build --release --locked --workspace --bins; then
            echo "=== build failed; guest kernel log tail ==="
            dmesg | tail -100 || true
            df -P / "$CARGO_TARGET_DIR"
            exit 1
          fi
        timeout-minutes: 75

      # `app-lb` itself takes no arguments — it is configured entirely from
      # `APP_LB_*` environment variables and, run bare, binds its proxy and
      # admin listeners and never returns. So there is no `--version` to call
      # here the way there is for `codegraph`, and starting it to see whether it
      # starts would mean a step that has to be killed.
      #
      # What is checkable without running it is that the dynamic linker can
      # resolve it. That is a weaker claim than "it boots" — most of this binary
      # is statically linked, including the vendored OpenSSL — but it is the
      # failure that an image missing a runtime library would actually produce,
      # and it costs nothing.
      #
      # `heyctl` is a clap CLI, so it gets the real test.
      - name: Smoke-test the binaries
        run: |
          set -eu
          for b in app-lb heyctl; do
            bin="$CARGO_TARGET_DIR/release/$b"
            [ -x "$bin" ] || { echo "FATAL: $b was not built at $bin" >&2; exit 1; }
            if ldd "$bin" | grep 'not found'; then
              echo "FATAL: $b has unresolved shared libraries (see above)" >&2
              exit 1
            fi
          done
          "$CARGO_TARGET_DIR/release/heyctl" --version
          "$CARGO_TARGET_DIR/release/heyctl" --help > /dev/null
          echo "ok: app-lb links cleanly, heyctl runs"

      # `ci/upload-artifact` tars its `path` relative to the *job's* working
      # directory — /workspace, the repository root — not the step's. And
      # CARGO_TARGET_DIR is outside the workspace entirely. So the binaries are
      # brought back in rather than the uploader taught about absolute paths.
      #
      # Stripped on the way: an artifact leaves the guest base64-encoded over
      # the exec channel, so a third off the payload is a third off a transfer
      # that is already the slowest part of a warm run. Debug symbols are not
      # what anybody pulls these binaries for; drop `strip` here if that changes.
      - name: Collect the binaries
        run: |
          set -eu
          mkdir -p dist
          for b in app-lb heyctl; do
            src="$CARGO_TARGET_DIR/release/$b"
            [ -f "$src" ] || { echo "FATAL: $b was not built at $src" >&2; exit 1; }
            cp "$src" "dist/$b"
            strip "dist/$b"
          done
          # The supervisor config each binary is deployed under, shipped beside
          # it. It is the one file a person needs to run the artifact and the
          # one most likely to drift from the binary it configures.
          cp app-lb/deploy/supervisor/app-lb.conf dist/
          # A real `git describe`, available only because this repository
          # submits as a bundle — the checkout clones it in the guest, so
          # /workspace is a repository with tags and history. A `--archive`
          # submit would have neither, which is why `ci.sha` is recorded beside
          # it rather than instead of it.
          describe="$(git -C /workspace describe --tags --always --dirty 2>/dev/null || echo 'no-git')"
          # `heyctl --version` reports the workspace version, which app-lb
          # shares (`version.workspace = true`), so this one line stamps both.
          # app-lb itself takes no arguments and cannot be asked.
          cat > dist/BUILD-INFO <<EOF
          version   $(dist/heyctl --version)
          describe  $describe
          commit    ${{ ci.sha }}
          branch    ${{ ci.branch }}
          run       ${{ ci.run_id }}
          EOF
          ( cd dist && sha256sum app-lb heyctl > SHA256SUMS )
          ls -la dist
          cat dist/BUILD-INFO

      # Lands in whichever sink the orchestrator is configured for — `disk`
      # (CI_ARTIFACT_DIR) by default, or the central `art serve` when
      # CI_ARTIFACT_SINK=artifacts. The workflow does not choose; it uploads.
      # Downloadable from the run page either way.
      - uses: ci/upload-artifact
        with:
          name: app-lb
          path: dist

  # ---------------------------------------------------------------------------
  # app-obs — parquet-backed logs and metrics for the deployments app-lb runs.
  # ---------------------------------------------------------------------------
  app-obs:
    if: ${{ changed('app-obs/**', '.ci/workflows/apps.yml', '.ci/image/apps/**') }}
    vm:
      driver: firecracker
      build:
        dockerfile: .ci/image/apps/Dockerfile
        context: .ci/image/apps
        # Must match the app-lb job exactly. `size_mb` is part of the hash that
        # names the image, so a different value here would build a second rootfs
        # from byte-identical inputs and neither job would reuse the other's.
        size_mb: 10240
      # `xlarge` (8 CPU, 16 GB), a class up from app-lb's despite having *fewer*
      # crates — 380 against 572. Crate count is the wrong measure here: the
      # graph is datafusion and the whole arrow/parquet stack, whose generated
      # code makes individual rustc invocations some of the most memory-hungry
      # in the ecosystem. `large` is 8 GB, and there is no swap in a microVM, so
      # a rustc that asks for more is not slow — it is OOM-killed, which surfaces
      # as an opaque signal. The build step's `dmesg` tail is what names it if
      # this is still not enough.
      size_class: xlarge
      # 40 GB against a measured 4.2 GB debug target dir — the largest of any
      # workspace here by a wide margin, again because of arrow and datafusion.
      disk_size_gb: 40
      # See the app-lb job for why this is set explicitly rather than left to
      # `CI_VM_TTL_SECONDS`. It matters more here: this is the longest build in
      # the repository, so it is the one most likely to meet a stale runner's
      # uptime cap.
      ttl_seconds: 14400
      # `app-obs` is a single package, not a workspace, so there is no sibling
      # manifest to list — the lockfile and its own manifest are the whole
      # dependency surface. Both `rust-toolchain.toml` paths for the same
      # missing-file-hashes-to-a-marker reason as above.
      cache_key_files:
        - app-obs/Cargo.lock
        - app-obs/Cargo.toml
        - app-obs/rust-toolchain.toml
        - rust-toolchain.toml
    env:
      CARGO_TERM_COLOR: never
      # Six, not the eight cores `xlarge` provides. Peak memory during a Rust
      # build is roughly (parallel rustc jobs x the largest crate's working
      # set), and datafusion's largest crates are big enough that eight at once
      # can crest 16 GB. Trading two cores for ~5 GB of headroom is the cheaper
      # side of that bet: the cost is wall-clock on a cold build, and the cost
      # of losing it is an OOM kill an hour in.
      #
      # This is a precaution, not a measurement — if a cold build here proves to
      # fit comfortably, delete this line and take the cores back.
      CARGO_BUILD_JOBS: "6"
    # Longer than app-lb's. datafusion from cold is the slowest thing this
    # repository builds; a warm VM reuses /var/cache/ci and relinks in minutes.
    timeout-minutes: 120
    steps:
      # Identical in intent to the app-lb job's guard — see there for why a
      # warm VM needs this even though init.sh runs the same check at boot.
      - name: Guard the cache disk
        run: |
          df -P "$CARGO_TARGET_DIR" /
          if [ "$(stat -c %d "$CARGO_TARGET_DIR")" = "$(stat -c %d /)" ]; then
            echo "FATAL: $CARGO_TARGET_DIR is on the rootfs — the data disk (/dev/vdb) is not attached." >&2
            echo "Check disk creation on the runner host." >&2
            exit 1
          fi
          usage=$(df -P "$CARGO_TARGET_DIR" | awk 'NR==2 {gsub(/%/,""); print $5}')
          if [ -n "$usage" ] && [ "$usage" -ge 85 ]; then
            echo "cache disk at ${usage}%, wiping $CARGO_TARGET_DIR"
            rm -rf "$CARGO_TARGET_DIR"
          fi

      - name: Build
        # Absolute, for the same reason as the app-lb job — `ci` renders
        # `working-directory:` verbatim rather than joining it onto /workspace.
        working-directory: /workspace/app-obs
        # `--bins` rather than a bare `--release`: this package has two binary
        # targets (`app-obs` from src/main.rs and `dump` from src/bin/), and
        # both ship. No `--workspace`, because unlike app-lb this is a lone
        # package with no members.
        #
        # `free -m` alongside the disk report: memory is the constraint that
        # actually bites on this build, so the number is worth having in the log
        # next to the CARGO_BUILD_JOBS that was chosen against it.
        run: |
          cargo fetch --locked
          df -P / "$CARGO_TARGET_DIR"
          free -m || true
          if ! cargo build --release --locked --bins; then
            echo "=== build failed; guest kernel log tail ==="
            echo "(look for 'Out of memory: Killed process' — that means"
            echo " CARGO_BUILD_JOBS is still too high for this size_class)"
            dmesg | tail -100 || true
            df -P / "$CARGO_TARGET_DIR"
            exit 1
          fi
        timeout-minutes: 105

      # `app-obs` takes no arguments either — it reads `APP_OBS_*` from the
      # environment and runs until killed — so it gets the same link check that
      # `app-lb` does rather than a real invocation.
      #
      # `dump` does run. With no arguments it prints its usage and exits 2,
      # which is enough to prove the process comes up, and it is the binary
      # where that is worth proving: it is linked against parquet and arrow, and
      # a mismatch there is exactly the kind of fault that compiles cleanly.
      - name: Smoke-test the binaries
        run: |
          set -eu
          for b in app-obs dump; do
            bin="$CARGO_TARGET_DIR/release/$b"
            [ -x "$bin" ] || { echo "FATAL: $b was not built at $bin" >&2; exit 1; }
            if ldd "$bin" | grep 'not found'; then
              echo "FATAL: $b has unresolved shared libraries (see above)" >&2
              exit 1
            fi
          done
          out="$("$CARGO_TARGET_DIR/release/dump" 2>&1 || true)"
          case "$out" in
            *usage:*) echo "ok: dump starts and prints its usage" ;;
            *) echo "FATAL: dump did not print a usage line; it said: $out" >&2; exit 1 ;;
          esac
          echo "ok: app-obs links cleanly"

      - name: Collect the binaries
        run: |
          set -eu
          mkdir -p dist
          src="$CARGO_TARGET_DIR/release/app-obs"
          [ -f "$src" ] || { echo "FATAL: app-obs was not built at $src" >&2; exit 1; }
          cp "$src" dist/app-obs
          strip dist/app-obs
          # Renamed on the way out. Cargo names this binary for its source file,
          # `src/bin/dump.rs`, but the program calls itself `app-obs-dump` in its
          # own usage line — and `dump` is far too generic a name to extract
          # into somebody's PATH from a tarball. The shipped name is the one the
          # tool answers to.
          src="$CARGO_TARGET_DIR/release/dump"
          [ -f "$src" ] || { echo "FATAL: dump was not built at $src" >&2; exit 1; }
          cp "$src" dist/app-obs-dump
          strip dist/app-obs-dump
          cp app-obs/deploy/supervisor/app-obs.conf dist/
          describe="$(git -C /workspace describe --tags --always --dirty 2>/dev/null || echo 'no-git')"
          cat > dist/BUILD-INFO <<EOF
          describe  $describe
          commit    ${{ ci.sha }}
          branch    ${{ ci.branch }}
          run       ${{ ci.run_id }}
          EOF
          ( cd dist && sha256sum app-obs app-obs-dump > SHA256SUMS )
          ls -la dist
          cat dist/BUILD-INFO

      - uses: ci/upload-artifact
        with:
          name: app-obs
          path: dist
