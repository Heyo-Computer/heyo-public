name: regional-rollout-preflight

on:
  submit:
    paths: ['.ci/workflows/regional-rollout-preflight.yml']

jobs:
  inspect:
    vm:
      driver: firecracker
      build:
        dockerfile: .ci/image/ci/Dockerfile
        context: .ci/image/ci
        size_mb: 6144
      size_class: small
      disk_size_gb: 10
      ttl_seconds: 1800
    timeout-minutes: 20
    steps:
      - name: Inspect live rollout prerequisites without changing services
        env:
          US3_TOKEN: ${{ secrets.APP_LB_US3_TOKEN }}
          EU1_TOKEN: ${{ secrets.APP_LB_EU1_TOKEN }}
          ORCHESTRATOR_TOKEN: ${{ secrets.ORCHESTRATOR_INTERNAL_API_KEY || '' }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          problems = []
          service = 'regional-rollout-smoke'
          def read(url, token):
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          def peer(url):
              parsed = urllib.parse.urlsplit(url)
              host = parsed.hostname
              if not host or parsed.scheme != 'http' or parsed.username or parsed.password:
                  raise ValueError('discovery endpoint must be a credential-free HTTP URL')
              if ':' in host:
                  host = '[' + host + ']'
              return f'{host}:{parsed.port or 80}'
          snapshots = []
          print(json.dumps({'credentialsPresent': {k: bool(os.environ.get(k)) for k in ['US3_TOKEN', 'EU1_TOKEN', 'ORCHESTRATOR_TOKEN']}}), flush=True)
          for region, deployment in [('us3', 'orchestrator-us3-next'), ('eu1', 'orchestrator-eu1')]:
              token = os.environ[region.upper() + '_TOKEN']
              request = urllib.request.Request(
                  f'https://admin.{region}.heyo.work/deployments/{deployment}',
                  headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      spec = json.load(response)['spec']
              except urllib.error.HTTPError as error:
                  problems.append(f'{region}: app-lb deployment read returned HTTP {error.code}')
                  print(problems[-1], flush=True)
                  continue
              vm = spec.get('vm') or {}
              env = vm.get('env_vars') or {}
              refs = vm.get('env_from') or []
              print(json.dumps({
                  'region': region, 'deployment': deployment,
                  'driver': vm.get('driver'), 'image': vm.get('image'),
                  'configFileConfigured': any(env.get(k) for k in ['HEYO_ORCHESTRATOR_CONFIG_PATH', 'HEYO_CONFIG_PATH']),
                  'discoveryRoutedServices': env.get('ORCHESTRATOR_DISCOVERY_ROUTED_SERVICES', ''),
                  'secretEnvironmentKeys': [r.get('as') for r in refs],
                  'mountPaths': [m.get('path') for m in vm.get('mounts', [])],
              }), flush=True)
          token = os.environ.get('ORCHESTRATOR_TOKEN', '')
          if not token:
              raise SystemExit('Live rollout test blocked: ORCHESTRATOR_INTERNAL_API_KEY is not provisioned in this workflow\'s HeyoSecret scope. No service changes made.')
          for region in ['us3', 'eu1']:
              request = urllib.request.Request(
                  f'https://orchestrator.{region}.heyo.work/orchestration/services/regional-rollouts/preflight-nonexistent',
                  headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raise SystemExit('Unexpected pre-existing preflight operation')
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise SystemExit(f'{region}: rollout API credential rejected or endpoint unavailable (HTTP {error.code})')
                  body = json.load(error)
                  if body.get('error') != 'Regional rollout not found':
                      raise SystemExit(f'{region}: regional rollout API not installed')
              print(region + ': authenticated regional rollout API available', flush=True)
              base = f'https://orchestrator.{region}.heyo.work/orchestration/services/{service}'
              baseline = read(base, token)
              if not baseline.get('route') or not baseline.get('ingressBackendUrl'):
                  problems.append(f'{region}: {service} has no established discovery ingress')
              try:
                  snapshot = read(base + '/discovery', token)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  problems.append(f'{region}: {service} has no discovery snapshot')
                  continue
              snapshots.append(snapshot)
              accepting = {peer(e['url']) for e in snapshot['endpoints'] if e['healthStatus'] == 'healthy' and not e['draining']}
              covered = {e.get('region') for e in snapshot['endpoints'] if e['healthStatus'] == 'healthy' and not e['draining']}
              if not {'us3', 'eu1'}.issubset(covered):
                  problems.append(f'{region}: healthy baseline replicas do not cover both regions')
              admin = f'https://admin.{region}.heyo.work'
              admin_token = os.environ[region.upper() + '_TOKEN']
              deployments = read(admin + '/deployments', admin_token)
              observers = [d['spec'] for d in deployments if (d.get('spec', {}).get('discovery') or {}).get('service_id') == service]
              if not observers:
                  problems.append(f'{region}: no app-lb deployment discovers {service}')
              for spec in observers:
                  observation = read(admin + '/deployments/' + urllib.parse.quote(spec['id'], safe='') + '/discovery-status', admin_token)
                  observed = {u['peer'] for u in observation['upstreams'] if not u['draining']}
                  if observation.get('serviceId') != service or observation.get('version') != snapshot['version'] or observed != accepting:
                      problems.append(f'{region}: app-lb has not adopted the exact discovery baseline')
          if len(snapshots) == 2 and snapshots[0] != snapshots[1]:
              problems.append('Regional orchestrators return different service discovery snapshots; one shared rollout authority is not established')
          if problems:
              raise SystemExit('; '.join(problems))
          print('Live ingress prerequisites verified; this is not proof of a completed regional rollout', flush=True)
          PY
