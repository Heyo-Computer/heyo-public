; heyo-mcp — the MCP server for heyo cloud's sandboxes and for app-lb, app-obs
; and ci, served over HTTP behind app-lb's app-token gate. See ../heyo-mcp.json
; for the deployment that fronts this.
;
; The listener binds loopback. That is not defence in depth, it is the only
; thing standing between the open internet and a process that can delete a
; deployment: the gate is in front of app-lb's port, not this one, so a public
; bind would be an unauthenticated hole straight past it.
[program:heyo-mcp]
command=/usr/bin/node /srv/heyo/heyo-public/mcp/dist/index.js
directory=/srv/heyo/heyo-public/mcp
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/var/log/heyo-mcp/heyo-mcp.log
stderr_logfile=/var/log/heyo-mcp/heyo-mcp.log
redirect_stderr=true
environment=
    ; Presence of this switches the process from stdio to HTTP.
    HEYO_MCP_HTTP_PORT="9650",
    ; Loopback, for the reason above. Do not widen this.
    HEYO_MCP_HTTP_HOST="127.0.0.1",

    ; heyo cloud — the sandbox tools. This is the one credential a customer
    ; instance actually needs: with it and nothing else, cloud comes up at its
    ; default base and the managed app-lb comes up beside it, its namespace
    ; discovered from the key. Leave it unset on a multi-tenant instance and
    ; each HTTP caller's own Authorization header is forwarded instead, so
    ; every caller acts under their own key and reaches their own sandboxes.
    ;
    ; Behind the app-token gate below there is no such caller: the gate admits
    ; `applb_…`, which cloud cannot consume and which is never substituted for a
    ; cloud key. So unset means unset — the sandbox tools are not listed at all
    ; and this becomes a fleet-operations instance (app-lb, app-obs, ci, feed).
    ; Setting it instead gives every caller the gate admits the SAME cloud
    ; account, which is a deliberate choice and not a default.
    HEYO_API_KEY="REPLACE-ME",
    ; HEYO_BASE_URL="https://server.heyo.computer",   ; a staging cloud only

    ; app-lb. A token, or APPLB_BASIC="user:pass" for a password-gated
    ; dashboard. app-lb compares a Basic header byte for byte, so paste the
    ; value rather than re-encoding it.
    ;
    ; Behind the app-token gate this is a FALLBACK, not the credential most
    ; calls use. A caller presenting `Bearer applb_…` reaches app-lb with their
    ; own token, and its `admin` level and `deployments` list are what app-lb
    ; enforces — this one is never substituted for theirs, so a token scoped to
    ; one deployment cannot borrow the reach of a token scoped to all of them.
    ; What is left for this value is the calls no caller authenticated: keep it
    ; as narrow as anything here needs, or leave it unset entirely and let every
    ; app-lb tool act strictly as whoever called.
    ;
    ; The corollary is on the minting side: a caller's reach IS their token's
    ; scope. Mint accordingly, and know what the two axes actually buy, because
    ; `admin` is coarser than it sounds:
    ;
    ;   none   passes the data-plane gate, reaches no admin route at all. The
    ;          sandbox tools still work — those are cloud, not app-lb.
    ;   view   /metrics, /disks, /feeds, /security, /ingress, /storage. That is
    ;          applb_metrics, applb_disks and the feed tools, and nothing else.
    ;   admin  everything, including every route that reads a deployment.
    ;
    ; There is NO read-only tier for deployment routes. `GET /deployments` and
    ; `GET /deployments/:id` are CRUD-tier — a spec's env vars can hold secrets
    ; — so applb_list_deployments, applb_get_deployment and
    ; applb_deployment_jobs all need `admin`, which is the same scope that
    ; deletes a deployment and execs in its VMs. A token that can read one can
    ; delete it.
    ;
    ; So the only narrowing that works for a caller who needs deployment reads
    ; is the `deployments` list (and `namespace`). Name the deployments; do not
    ; expect `admin` to mean "read".
    APPLB_URL="http://127.0.0.1:8080",
    APPLB_TOKEN="REPLACE-ME",
    ; Managed mode instead: reach the platform's app-lb through heyo cloud,
    ; confined to one namespace, with a customer heyo_api_* key. Same tools,
    ; different base — APPLB_NAMESPACE turns the URL into
    ; ${APPLB_URL}/namespaces/team-a/lb. Leave APPLB_TOKEN unset here and each
    ; HTTP caller's own Authorization header is forwarded instead, which is how
    ; one instance serves every tenant under their own key.
    ;   APPLB_URL="https://server.heyo.computer",
    ;   APPLB_NAMESPACE="team-a",
    ;   APPLB_TOKEN="heyo_api_REPLACE-ME",

    ; app-obs. Its query routes want this; /healthz stays open without it.
    ;
    ; This is app-obs's OWN token, compared against what app-obs was configured
    ; with — not an app-lb credential. A caller's `applb_…` is therefore never
    ; substituted for it here, which is what keeps this loopback deployment
    ; working unchanged. The rule only flips when the value itself is an
    ; `applb_…` token, meaning obs is being reached through an app-lb gate
    ; rather than on 127.0.0.1. Same for CI_TOKEN below. See ../vm.md.
    APP_OBS_URL="http://127.0.0.1:9600",
    APP_OBS_API_TOKEN="REPLACE-ME",

    ; ci, and this one is not the public hostname on purpose. ci behind an
    ; app-lb gate admits browsers only for its PAGES — the split is
    ; `Accept: text/html`, and /runs, /jobs, /runners, /vms and /repos are all
    ; outside its public_paths, so no token reaches them through the gate. This
    ; is ci's own listener on the same box, which is what diagnose_ci_job wants.
    CI_URL="http://127.0.0.1:9555",
    ; The read API is the exception: /api/runs/ IS in ci's public_paths and
    ; takes a repository submit token, so ci_run_status and ci_run_logs work
    ; against either address. Set this to the same token `git submit` uses
    ; (`git config ci.token`) — without it those two tools 401 while everything
    ; else on the loopback listener keeps working, which is a confusing way to
    ; find out. It is scoped to one repository: a run belonging to another
    ; answers 404.
    CI_TOKEN="REPLACE-ME",

    ; The artifact store — art_publish and the art_* reads. This is the only
    ; service that needs TWO credentials, one per layer, and they go on
    ; different headers on the same request:
    ;
    ;   ART_GATE_TOKEN  -> Authorization: Bearer applb_…   (app-lb's gate)
    ;   ART_API_KEY     -> x-api-key                       (the store itself)
    ;
    ; Both were reachable only through Authorization until the store's
    ; x-api-key was used for the second, which is why publishing from outside
    ; the network looked structurally impossible: whichever credential you sent,
    ; the other layer refused it. ci never hit this because ci runs inside the
    ; network, where there is no gate.
    ;
    ; ART_GATE_TOKEN falls back to APPLB_TOKEN, which is usually right — the
    ; gate wants an app-token with `admin` scope covering the `artifacts`
    ; deployment, and that is normally the same token. Behind the app-token gate
    ; a caller's own `applb_…` replaces it per request, exactly as it does for
    ; app-lb; ART_API_KEY never is, because it carries no scope to widen.
    ;
    ; Reaching the store on its own listener instead needs only ART_API_KEY —
    ; there is no gate there, and no bearer is sent.
    ;   ART_URL="http://127.0.0.1:8090",
    ART_URL="https://art.us2.heyo.work",
    ART_API_KEY="REPLACE-ME",
    ; ART_GATE_TOKEN="applb_REPLACE-ME",   ; defaults to APPLB_TOKEN

    ; Per-request bound on calls to the services above. A service that
    ; accepts a connection and then answers nothing is this fleet's
    ; characteristic failure; unbounded, that becomes a tool call that never
    ; returns.
    HEYO_MCP_TIMEOUT_MS="30000",

    ; Required by the app-token gate in ../heyo-mcp.json, and only by it.
    ; app-lb admits `Authorization: Bearer applb_…` with no Identity at all —
    ; "a token is not a person" — so it forwards no x-auth-request-* headers
    ; and the check in identity.ts would refuse every request the gate lets
    ; through. Turning it off is safe here for two reasons that must both hold:
    ; the gate in front is doing exactly the work the check stands in for, and
    ; the listener above is still loopback. Switch the gate to `jwt` and this
    ; goes back to unset — a caller's JWT carries its own subject.
    HEYO_MCP_REQUIRE_IDENTITY="0"

; Unset means required: the process refuses any request without the gate's
; forwarded identity, which is what makes reaching the loopback port directly
; useless. That is the right setting behind a `google` or `jwt` gate, where an
; identity is forwarded. It is the wrong one behind `app-token`, which forwards
; none by design — hence the 0 above. Do not carry that 0 over to a gate that
; does forward an identity, and never set it with no gate in front at all:
; that leaves an unauthenticated hole into a process that can delete a
; deployment.
