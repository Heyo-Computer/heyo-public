; supervisord program config for the pg-vm-pool Postgres pooler.
;
; Install by copying (or symlinking) into your supervisor include dir, e.g.:
;   sudo ln -s /home/sam/Projects/pg-fc/deploy/supervisor/pg-vm-pool.conf \
;              /etc/supervisor/conf.d/pg-vm-pool.conf
;   sudo supervisorctl reread && sudo supervisorctl update
; then:  supervisorctl {start,stop,restart,tail} pg-vm-pool
;
; Manage all runtime config from the `environment=` line below — edit it, then
; `supervisorctl reread && supervisorctl update pg-vm-pool` (a plain restart
; does NOT reload environment=; update does).
;
; Build the release binary first:  cargo build --release
; The pooler needs a local heyvmd (POST /sandboxes/:id/tcp-tunnel) already
; running; run that under its own supervisor program if it isn't a system svc.
;
; One-time host setup for the density machinery enabled below:
;
; 1. Deploy the reclaim script OUTSIDE the checkout (RECLAIM_CMD must not
;    break when the repo moves or is being rebuilt):
;      install -D -m 0755 reclaim-disks.sh /home/sam/.heyo/bin/reclaim-disks.sh
;    and pin it in sudoers (visudo -f /etc/sudoers.d/pg-vm-pool) — argument
;    list pinned exactly, since the script needs root and the pooler calls it
;    with `sudo -n`:
;      sam ALL=(root) NOPASSWD: /home/sam/.heyo/bin/reclaim-disks.sh /home/sam/.heyo/run --shrink --prune-swap
;
; 2. Registry migration: HOME= below pins pooler state to
;    /home/sam/.heyo/pg-vm-pool/. Earlier deployments of this unit had no
;    HOME=, so the registry landed inside the checkout. Before first start
;    with this config, move it if present:
;      mkdir -p ~/.heyo/pg-vm-pool
;      mv /home/sam/Projects/pg-fc/.heyo/pg-vm-pool/registry.tsv ~/.heyo/pg-vm-pool/ 2>/dev/null || true
;    (also move metrics/ and dumps/ from the same stray dir if they exist).
;    The registry is the ONLY binding between schemas and their VMs/spares —
;    losing it makes every existing schema look brand-new.
;
; 3. Fill in the PG_VM_POOL_S3_* placeholders below before enabling; the
;    archive tier refuses to start without them.
;
; 4. Rollout sequencing on a backlogged host: start with COMPACT_AFTER_SECS
;    and ARCHIVE_AFTER_SECS commented out, let the orphan sweep + a full
;    reclaim pass finish first (frees slack, so the first compact/archive
;    sweep has headroom), then enable the timers and `supervisorctl update`.

[program:pg-vm-pool]
command=/home/sam/Projects/pg-fc/target/release/pg-vm-pool
directory=/home/sam/Projects/pg-fc
user=sam

; --- runtime config (this is the point of the unit: manage env here) ---
; Values with commas (e.g. KEEPALIVE_SCHEMAS) MUST be double-quoted so the
; comma isn't read as a field separator. Omit a var to take the code default.
;   PG_VM_POOL_LISTEN                default 127.0.0.1:6432
;   PG_VM_POOL_IMAGE                 default pg
;   PG_VM_POOL_SIZE_CLASS            default micro (0.25 CPU, 512MB); also
;                                    mini/small/medium/large — same tier for
;                                    every schema's VM, no per-schema override
;   PG_VM_POOL_USER                  default postgres
;   PG_VM_POOL_PASSWORD              default unset (no client auth gate; trust
;                                    backend auth). Set to require this exact
;                                    password from clients (cleartext challenge,
;                                    rejects anyone who doesn't send it) AND to
;                                    use it for the probe/bootstrap if the
;                                    backend needs scram/md5 instead of trust.
;                                    Pair with TLS below unless LISTEN is loopback.
;   PG_VM_POOL_IDLE_TIMEOUT_SECS     default 900; 0 disables idle reaping
;   PG_VM_POOL_READY_TIMEOUT_SECS    default 300
;   PG_VM_POOL_MAX_CONCURRENT_BRINGUPS
;                                    default 3; 0 disables. Caps how many VM
;                                    bring-ups (deploys + boots of stopped
;                                    VMs) hit heyvmd at once; the excess
;                                    queues FIFO in the pooler. The daemon
;                                    runs blocking mkfs/debugfs work on its
;                                    async workers, so an unbounded burst
;                                    (e.g. a reconnect storm) parks every
;                                    worker and it stops answering entirely —
;                                    then the watchdog restarts it, killing
;                                    all running VMs and seeding the next
;                                    storm. Keep this well under the host's
;                                    core count
;   PG_VM_POOL_CONNECT_TIMEOUT_SECS  default 30 (iroh tunnel handshake cap)
;   PG_VM_POOL_DIRECT_CONNECT        default on; "0" forces the iroh tunnel path
;   PG_VM_POOL_DATA_DISK_GB          default 2. Keep SMALL: with automatic
;                                    device growth (below) this is only the
;                                    starting ceiling, not a provision-for-
;                                    the-worst-case guess. 2 pairs with the
;                                    image's 2GB initial fs + 256MB WAL floor
;                                    (init.sh) — ~1GB of data room at birth
;   PG_VM_POOL_DISK_GROW_PCT         default unset (off). Setting it (e.g. 85)
;                                    enables on-demand data-DEVICE growth: at
;                                    idle-stop, a VM whose data fs is >= this
;                                    % full AND spans its device is grown
;                                    (doubled, offline, via the daemon's
;                                    workspace resize — needs a heyvmd with
;                                    that feature) while it sits stopped
;   PG_VM_POOL_DISK_MAX_GB           default 100; device growth ceiling (the
;                                    daemon itself caps at 250)
;   PG_VM_POOL_KEEPALIVE_SCHEMAS     default none; comma-separated, quote it
;   PG_VM_POOL_RUN_DIR               default: PG_VM_POOL_PRESSURE_PATH if set,
;                                    else unset. The heyvmd run dir holding each
;                                    VM's sb-<id>/; lets the pooler verify a
;                                    killed VM's disk was actually removed (a
;                                    kill the daemon acks but doesn't act on
;                                    strands the disk — logged loudly, not
;                                    reported as "disk reclaimed")
;   PG_VM_POOL_ORPHAN_SWEEP_SECS     default off. Positive value enables the
;                                    orphan-disk sweep: periodically delete
;                                    sb-<id>/ dirs heyvmd has forgotten (data
;                                    already offloaded / unreferenced), the
;                                    backlog left by kills the daemon acked but
;                                    didn't act on. Needs PG_VM_POOL_RUN_DIR;
;                                    never deletes a live schema's disk
;   PG_VM_POOL_RECLAIM_CMD           default unset (off). Shell command (via
;                                    sh -c) that offline-trims stopped VMs'
;                                    data disks — normally `sudo -n
;                                    <stable path>/reclaim-disks.sh <run-dir>
;                                    --shrink --prune-swap` behind the pinned
;                                    sudoers entry (see header). Without it,
;                                    guest-freed blocks NEVER return to the
;                                    host (no discard passthrough): disks
;                                    ratchet toward full provisioned size
;   PG_VM_POOL_RECLAIM_INTERVAL_SECS default 3600; backstop cadence — an extra
;                                    run also fires shortly after idle-stops
;   PG_VM_POOL_COMPACT_AFTER_SECS    default 0 (off). Positive value enables
;                                    the local COMPACTED tier: a schema whose
;                                    VM has sat stopped this long has its data
;                                    disk trimmed + zstd'd into a local image
;                                    (~5-25x smaller than the ext4; measured
;                                    183MB -> 7MB on a real pool disk) and the
;                                    VM + disk deleted. No boot, no pg_dump —
;                                    seconds of CPU; thaw is a decompress +
;                                    boot. Needs PG_VM_POOL_RUN_DIR + zstd.
;                                    The preferred local tier
;   PG_VM_POOL_COMPACT_SWEEP_SECS    default 900; compact sweep interval
;   PG_VM_POOL_COMPACT_DIR           default <state dir>/compact; where the
;                                    <schema>.img.zst files live
;   PG_VM_POOL_FREEZE_AFTER_SECS     default 0 (off). Positive value enables
;                                    the local frozen tier: a schema untouched
;                                    this long is pg_dump'd to a local file and
;                                    its VM + disk killed; next connect
;                                    restores it. A cold schema then costs
;                                    dump-file bytes (~1-5MB) instead of an
;                                    ext4 image. Sits between the idle reaper
;                                    and the S3 tier. NOTE: freezing boots the
;                                    VM to pg_dump it — with the compacted
;                                    tier on, prefer that and leave this off
;                                    (or set it well above COMPACT_AFTER)
;   PG_VM_POOL_FREEZE_SWEEP_SECS     default 900; freeze sweep interval
;   PG_VM_POOL_DUMP_DIR              default ~/.heyo/pg-vm-pool/dumps; the
;                                    local dump store — frozen dumps live
;                                    here, and S3 archive dumps stage here
;                                    (streamed from the guest, uploaded by
;                                    the pooler, then removed)
;   PG_VM_POOL_DUMP_LISTEN           default 0.0.0.0:6433; dump server bind —
;                                    must be reachable from the VM bridge
;                                    (guests dump to it via their gateway).
;                                    The server runs whenever the frozen OR
;                                    the S3 archive tier is enabled
;   PG_VM_POOL_ARCHIVE_VIA_GUEST     default off. "1" reverts S3 archive dumps
;                                    to the legacy route (guest dumps to a
;                                    file on its own data disk, curls it to a
;                                    presigned PUT). Escape hatch only: the
;                                    guest-file route permanently inflates the
;                                    sparse data disk it is archiving (no
;                                    discard passthrough)
;   PG_VM_POOL_PRESSURE_PATH         default unset (off). A path on the disks'
;                                    filesystem (normally the run dir); enables
;                                    emergency pressure eviction: above
;                                    PRESSURE_HIGH_PCT usage, oldest-idle
;                                    schemas are archived to S3 until usage
;                                    falls below PRESSURE_LOW_PCT — the host
;                                    evicts instead of hitting ENOSPC. Needs
;                                    the S3 tier
;   PG_VM_POOL_PRESSURE_HIGH_PCT     default 85; eviction trigger
;   PG_VM_POOL_PRESSURE_LOW_PCT      default 75; eviction stop
;   PG_VM_POOL_PRESSURE_CHECK_SECS   default 60; usage poll interval
;   PG_VM_POOL_DASHBOARD_LISTEN      default unset (dashboard off); bind addr
;                                    for the admin dashboard (tier counts,
;                                    per-VM disk, reclaim/purge buttons)
;   PG_VM_POOL_STATE_FILE            default ~/.heyo/pg-vm-pool/registry.tsv
;   PG_VM_POOL_METRICS_DIR           default <state-file dir>/metrics. Daily
;                                    partition files (events-YYYY-MM-DD.tsv)
;                                    backing the monitoring page's restore/
;                                    VM-created charts across restarts;
;                                    14-day retention, pruned automatically
;   PG_VM_POOL_TLS_CERT              default unset (TLS off); PEM cert chain path
;   PG_VM_POOL_TLS_KEY               default unset; PEM private key path — set
;                                    BOTH or NEITHER; files hot-reload on change
;                                    (certbot renewals need no restart)
;   PG_VM_POOL_ARCHIVE_AFTER_SECS    default 0 (off). Positive value enables the
;                                    S3 eviction tier: offload a schema untouched
;                                    this long to S3 and kill its VM to reclaim
;                                    disk (e.g. 604800 = 1 week). Requires the S3
;                                    vars below; the next connect restores it.
;   PG_VM_POOL_ARCHIVE_SWEEP_SECS    default 3600; eviction sweep interval
;   PG_VM_POOL_IMAGE_ARCHIVE         default unset (off). "1" enables the image-
;                                    level fallback: when a schema's dump-based
;                                    archive fails (Postgres won't boot/dump),
;                                    its stopped VM's raw data.ext4 is trimmed,
;                                    zstd-compressed, and uploaded to S3 instead
;                                    ({schema}.img.zst) — no boot needed. Also
;                                    adds a per-VM "archive disk image" button.
;                                    Requires the S3 tier + PG_VM_POOL_RUN_DIR,
;                                    plus zstd (and ideally e2fsck) on the host.
;   PG_VM_POOL_IMAGE_SPOOL_DIR       default <state dir>/spool; where the
;                                    compressed image is staged before upload
;                                    (needs ~the disk's allocated size free)
;   PG_VM_POOL_S3_BUCKET             required when eviction on; dump bucket
;   PG_VM_POOL_S3_PREFIX             default pg-vm-pool/; object key prefix
;   PG_VM_POOL_S3_REGION             default us-east-1; SigV4 region
;   PG_VM_POOL_S3_ENDPOINT           default AWS; set for MinIO/R2 (path-style)
;   PG_VM_POOL_S3_ACCESS_KEY_ID      required; falls back to AWS_ACCESS_KEY_ID
;   PG_VM_POOL_S3_SECRET_ACCESS_KEY  required; falls back to AWS_SECRET_ACCESS_KEY
;   RUST_LOG                         default info,pg_vm_pool=info
environment=
    HOME="/home/sam",
    PG_VM_POOL_LISTEN="127.0.0.1:6432",
    PG_VM_POOL_IMAGE="pg",
    PG_VM_POOL_USER="postgres",
    PG_VM_POOL_IDLE_TIMEOUT_SECS="300",
    PG_VM_POOL_READY_TIMEOUT_SECS="300",
    PG_VM_POOL_MAX_CONCURRENT_BRINGUPS="3",
    PG_VM_POOL_DATA_DISK_GB="2",
    PG_VM_POOL_DISK_GROW_PCT="85",
    PG_VM_POOL_DISK_MAX_GB="25",
    PG_VM_POOL_KEEPALIVE_SCHEMAS="",
    PG_VM_POOL_RUN_DIR="/home/sam/.heyo/run",
    PG_VM_POOL_ORPHAN_SWEEP_SECS="900",
    PG_VM_POOL_RECLAIM_CMD="sudo -n /home/sam/.heyo/bin/reclaim-disks.sh /home/sam/.heyo/run --shrink --prune-swap",
    PG_VM_POOL_COMPACT_AFTER_SECS="3600",
    PG_VM_POOL_ARCHIVE_AFTER_SECS="86400",
    PG_VM_POOL_IMAGE_ARCHIVE="1",
    PG_VM_POOL_PRESSURE_PATH="/home/sam/.heyo/run",
    PG_VM_POOL_S3_BUCKET="CHANGE-ME",
    PG_VM_POOL_S3_ACCESS_KEY_ID="CHANGE-ME",
    PG_VM_POOL_S3_SECRET_ACCESS_KEY="CHANGE-ME",
    PG_VM_POOL_DASHBOARD_LISTEN="127.0.0.1:34199",
    RUST_LOG="info,pg_vm_pool=info",
    PG_VM_POOL_PASSWORD="secret"
; Non-AWS S3 (R2/MinIO): also set PG_VM_POOL_S3_ENDPOINT (path-style) and
; PG_VM_POOL_S3_REGION if not us-east-1.
; To enable client-facing TLS, append (see README "TLS" section):
;    PG_VM_POOL_TLS_CERT="/home/sam/.heyo/pg-vm-pool/tls/fullchain.pem",
;    PG_VM_POOL_TLS_KEY="/home/sam/.heyo/pg-vm-pool/tls/privkey.pem"

; --- process management ---
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true

; --- logs ---
redirect_stderr=true
stdout_logfile=/var/log/pg-vm-pool/pg-vm-pool.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
