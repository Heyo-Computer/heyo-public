# supervisord program definition for app-obs.
#
# Install into your supervisord include dir (typically
# /etc/supervisor/conf.d/app-obs.conf), then `supervisorctl reread && update`.
# See deploy/supervisor/README.md for the one-time host setup.
#
# app-obs is configured entirely by environment variables (no config file, no CLI
# args) and runs in the foreground, so supervisord manages the process directly.

[program:app-obs]
command=/usr/local/bin/app-obs
directory=/var/lib/app-obs
user=app-obs

# app-obs reads configuration only from the environment. DATA_DIR is pinned to an
# absolute path so partitions are written to the same place regardless of CWD.
# Defaults mirror the built-in ones; uncomment and edit the rest as needed.
environment=
    RUST_LOG="info,app_obs=debug",
    APP_OBS_DATA_DIR="/var/lib/app-obs/data",
    ; Ingest binds all interfaces on purpose: every microVM sits on its own /30
    ; and reaches us on its own tap gateway, so no single address serves them all.
    APP_OBS_INGEST_ADDR="0.0.0.0:9500",
    APP_OBS_SYSLOG_ADDR="0.0.0.0:9514",
    ; Keep the API on loopback — app-lb fronts it and terminates TLS.
    APP_OBS_API_ADDR="127.0.0.1:9600",
    APP_LB_URL="http://127.0.0.1:9090"
    ; When uncommenting below, keep the leading comma and put no comment on the
    ; same line: whether a trailing `;` is stripped depends on the Python
    ; configparser underneath, and when it isn't, it lands inside the value and
    ; supervisord rejects the whole environment.
    ;
    ; UNSET LEAVES INGEST OPEN: anything that can reach :9500 can write records.
    ; Set this and chmod 0640 this file (see the README on secrets).
    ; ,APP_OBS_INGEST_TOKEN="change-me"
    ;
    ; Only needed when app-lb runs with APP_LB_ADMIN_AUTH=1.
    ; ,APP_LB_USER="admin"
    ; ,APP_LB_PASSWORD="change-me"
    ;
    ; Metrics poll interval.
    ; ,APP_OBS_POLL_SECS="10"
    ; Partitions older than this are deleted.
    ; ,APP_OBS_RETAIN_DAYS="30"
    ; Flush a partition at this many buffered rows, or this long after its first
    ; row, whichever comes first.
    ; ,APP_OBS_FLUSH_ROWS="10000"
    ; ,APP_OBS_FLUSH_SECS="60"
    ; Ingest queue depth before records are dropped and counted.
    ; ,APP_OBS_QUEUE_CAPACITY="65536"

# Restart policy. `unexpected` restarts on a non-zero/panic exit but not a clean
# stop. The one startup panic is an unusable APP_OBS_DATA_DIR, which will not fix
# itself, so startretries bounds the crash-loop before FATAL. Note that a listener
# that fails to bind does NOT exit the process — see the README.
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
exitcodes=0

# SIGTERM makes app-obs flush buffered records to parquet before exiting, and it
# allows itself up to 30s to do so. stopwaitsecs must exceed that, or supervisord
# SIGKILLs mid-flush and the buffered records are lost.
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true

# app-obs logs to stdout/stderr via tracing.
stdout_logfile=/var/log/app-obs/app-obs.log
stderr_logfile=/var/log/app-obs/app-obs.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
