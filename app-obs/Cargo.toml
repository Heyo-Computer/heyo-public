[package]
name = "app-obs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
datafusion = "54.1.0"
futures-util = { version = "0.3.31", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
# The daemon's log stream is a WebSocket; plain (non-TLS) is enough because
# the daemon is reached over loopback or the host network, never the internet.
tokio-tungstenite = "0.24"
async-nats = "0.47"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
