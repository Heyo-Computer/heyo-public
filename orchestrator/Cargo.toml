[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "orchestrator"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
config = "0.14"
dirs = "5.0"
dotenvy = "0.15"
jsonwebtoken = "9.2"
base64 = "0.21"
async-nats = "0.47"
futures = "0.3"
heyosecret-client = { path = "../heyosecret-client" }
sha2 = "0.10"
thiserror = "1.0"
once_cell = "1.19"
uuid = { version = "1.0", features = ["v4", "serde"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json", "with-uuid"], default-features = false }

[[bin]]
name = "orchestrator"
path = "src/main.rs"
