# supervisord program definition for queue.
#
# Install into your supervisord include dir (typically
# /etc/supervisor/conf.d/queue.conf), then `supervisorctl reread && update`.
#
# queue is configured entirely by environment variables (no config file, no CLI
# args) and runs in the foreground, so supervisord manages the process directly.

[program:queue]
command=/usr/local/bin/queue
directory=/var/lib/queue
user=queue

# Start after nats-server rather than before it. Nothing breaks if this loses
# the race — the first scrape fails, the dashboard says so, and the next one
# succeeds — but a startup log full of connection refusals is noise nobody
# needs. nats-server's own program in this fleet uses priority=100.
priority=200

environment=
    RUST_LOG="info,queue=debug",
    ; nats-server's `http:` listener. Loopback, because it takes no credential.
    QUEUE_NATS_MONITOR_URL="http://127.0.0.1:8222",
    ; Keep the dashboard on loopback — app-lb fronts it and terminates TLS.
    QUEUE_API_ADDR="127.0.0.1:9700",
    ; The log file nats-server's supervisor program captures its stdout into
    ; (`stdout_logfile` in that program's config). The `queue` user needs read
    ; access: `usermod -aG nats queue`, or a group-readable /var/log/nats.
    QUEUE_NATS_LOG_FILE="/var/log/nats/nats-server.log"
    ; When uncommenting below, keep the leading comma and put no comment on the
    ; same line: whether a trailing `;` is stripped depends on the Python
    ; configparser underneath, and when it isn't, it lands inside the value and
    ; supervisord rejects the whole environment.
    ;
    ; Set this when the dashboard is exposed without an app-lb auth gate in
    ; front of it. /healthz and /__ui/ stay open either way.
    ; ,QUEUE_API_TOKEN="change-me"
    ;
    ; Scrape interval, and so the resolution of every rate on the page.
    ; ,QUEUE_POLL_SECS="5"
    ; Samples kept for the charts; 720 at a 5s poll is an hour.
    ; ,QUEUE_HISTORY_POINTS="720"
    ; Log lines held in memory, and how much of the file to read on startup.
    ; ,QUEUE_LOG_LINES="2000"
    ; ,QUEUE_LOG_PRIME_BYTES="65536"
    ;
    ; Widen the theme cookie to the parent domain so one choice of light or
    ; dark covers app-lb, app-obs, ci and this. Match app-lb's
    ; auth.cookie_domain for the deployment.
    ; ,HEYO_UI_COOKIE_DOMAIN="example.com"

# Restart policy. There is one deliberate non-zero exit — a dashboard port that
# will not bind — and it does not fix itself, so startretries bounds the
# crash-loop before FATAL rather than letting it run forever. A monitoring port
# that is down is *not* an exit: that is the condition this app exists to
# report, and it reports it on the page.
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
exitcodes=0

# Nothing here is persisted — history and the log tail live in memory — so
# shutdown has nothing to flush and needs no grace period beyond letting
# in-flight requests finish.
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/queue/queue.log
stderr_logfile=/var/log/queue/queue.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
