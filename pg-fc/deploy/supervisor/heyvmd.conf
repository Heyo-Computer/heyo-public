; supervisord program config for heyvmd, the heyo VM control-plane daemon
; pg-vm-pool depends on (serves the local sandbox HTTP API on 34099 — see
; pg-vm-pool.conf, which talks to it over plain HTTP at 127.0.0.1:34099 and
; needs it running first).
;
; Install by copying (or symlinking) into your supervisor include dir, e.g.:
;   sudo mkdir -p /var/log/heyvmd && sudo chown sam:sam /var/log/heyvmd
;   sudo ln -s /home/sam/Projects/pg-fc/deploy/supervisor/heyvmd.conf \
;              /etc/supervisor/conf.d/heyvmd.conf
;   sudo supervisorctl reread && sudo supervisorctl update
; then:  supervisorctl {start,stop,restart,tail} heyvmd
;
; This installs TWO programs: heyvmd itself, and a health-check sidecar that
; force-restarts it if its API stops responding (see heyvmd-healthcheck.sh).
; A restart no longer kills running VMs (see stopasgroup/killasgroup below).

[program:heyvmd]
command=/usr/bin/heyvmd --api-port 34099
directory=/home/sam
user=sam
; supervisord does NOT inherit the login shell's PATH — children get a minimal
; environment. heyvm invokes `firecracker` by bare name (relying on PATH), and
; firecracker lives in /usr/local/bin, so without this it fails with
; "Firecracker is not available". Include /usr/local/sbin + /usr/sbin too since
; VM setup shells out to sbin tools (ip, useradd, etc.).
; HEYVM_DISABLE_SIBLING_HOSTS: after every Firecracker create, the daemon
; syncs /etc/hosts entries into every OTHER running VM — holding its internal
; sandbox-handles write lock across guest execs, up to ~25s per running VM
; per create. On a pooler host that serializes deploy bursts into
; minutes-long API stalls, and the pg VMs never address each other by
; hostname, so the sync buys nothing here. The daemon documents this env var
; as the escape hatch for exactly this deployment shape. (heyvm >= 0.43.11
; runs the sync off the create path and bounded, but on this host it is still
; pure waste — keep it off. Verify it's live: the 2026-08-21 outage was this
; var missing from the running daemon's environment.)
; HEYVMD_READY_TIMEOUT_SECS: serial HEYVM_READY budget for a cold boot. The pg
; image runs mkfs + swapfile + initdb before the marker on a blank disk.
; HEYVMD_CREATE_TIMEOUT_SECS: end-to-end backstop on one gated create so a hung
; create releases its slot instead of wedging the 4-wide create gate.
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME="/home/sam",USER="sam",HEYVM_DISABLE_SIBLING_HOSTS="1",HEYVMD_READY_TIMEOUT_SECS="60",HEYVMD_CREATE_TIMEOUT_SECS="180"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=15
; VMs SURVIVE a daemon stop/restart. Firecracker VMMs are spawned in their
; own session (setsid) with a detached serial console (per-VM FIFO + log file
; under the run dir — see heyvm's driver/vmm_console.rs), so they neither
; sit in heyvmd's process group nor hold pipes that die with it; the fresh
; daemon reattaches to them (console, exec and shell included) on startup.
; These two MUST stay false for that to hold: with `true`, supervisor signals
; the whole group and kills every running VM on `restart heyvmd` — the
; fleet-wide cold-start storm this design exists to end. Only flip them back
; with a heyvmd that predates the detached console (its VMs would die on
; daemon exit anyway, via their broken pipes).
stopasgroup=false
killasgroup=false
redirect_stderr=true
stdout_logfile=/var/log/heyvmd/heyvmd.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; --- health check / watchdog ---
; `autorestart` above only fires once the heyvmd *process* exits; it does
; nothing if the process is alive but wedged (API stopped responding while
; the daemon itself is still up). This sidecar polls GET /health (a trivial
; lock-free handler) every HEYVMD_HEALTHCHECK_INTERVAL_SECS and, after
; FAIL_THRESHOLD consecutive failures, runs `supervisorctl restart heyvmd`.
;
; A restart KILLS EVERY RUNNING VM (the Firecracker processes are the
; daemon's children and stopasgroup takes the whole group), and the ensuing
; mass cold-start is itself the kind of burst that wedges the daemon — a
; hasty watchdog creates a restart loop. So the thresholds below are
; deliberately patient (~8 failed polls ≈ 2–4.5 min of sustained /health
; silence before acting), the probe keys on /health rather than the
; lock-contended /deployed-sandboxes (which the script still probes, but
; log-only), and the post-restart cooldown is long enough for the reconnect
; storm to drain before the daemon is judged again. See the script header
; for the full rationale.
;
; Deliberately has no `user=` (so it runs as whatever supervisord itself runs
; as, normally root): /var/run/supervisor.sock is 0700 root-owned, so a
; user=sam process cannot call supervisorctl at all.
[program:heyvmd-healthcheck]
command=/home/sam/Projects/pg-fc/deploy/supervisor/heyvmd-healthcheck.sh
autostart=true
autorestart=true
startsecs=5
environment=
    HEYVMD_HEALTHCHECK_PORT="34099",
    HEYVMD_HEALTHCHECK_INTERVAL_SECS="15",
    HEYVMD_HEALTHCHECK_CURL_TIMEOUT_SECS="20",
    HEYVMD_HEALTHCHECK_FAIL_THRESHOLD="8",
    HEYVMD_HEALTHCHECK_COOLDOWN_SECS="600"
redirect_stderr=true
stdout_logfile=/var/log/heyvmd/heyvmd-healthcheck.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
